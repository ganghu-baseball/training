<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#152632;overflow:hidden}canvas{display:block}</style></head>
<body><script type="module">
// 人物外型預覽：window.show('pitch' | 'makeMedballThrow' | 'makeHipSupine' ..., opts, t, {pos, look, fov}, glove)
import { createWorld } from './js/world.js';
import { Pitcher } from './js/rig.js';
import { poseAt, makePitch } from './js/motions.js';
import * as H from './js/hipdrills.js';
import * as D from './js/drills.js';
const W = +(new URLSearchParams(location.search).get('w') || 960), H9 = Math.round(W * 9 / 16);
const world = createWorld(W, H9);
document.body.appendChild(world.renderer.domElement);
const pitcher = new Pitcher();
world.scene.add(pitcher.group);
const cache = {};
window.show = (name, opts, t, cam, glove) => {
  const key = name + JSON.stringify(opts || {});
  const m = cache[key] || (cache[key] = name === 'pitch' ? makePitch(opts || {}) : (H[name] || D[name])(opts || {}));
  const onMound = name === 'pitch';
  for (const k of ['mound', 'rubber', 'plate', 'target']) if (world[k]) world[k].visible = onMound;
  pitcher.setGlove(glove !== undefined ? glove : onMound);
  const S = pitcher.update(poseAt(m, t));
  world.camera.fov = cam.fov || 30; world.camera.updateProjectionMatrix();
  world.camera.position.set(...cam.pos); world.camera.up.set(0, 1, 0); world.camera.lookAt(...cam.look);
  world.renderer.info.render.frame++;
  world.renderer.render(world.scene, world.camera);
  const r = v => v.toArray().map(x => +x.toFixed(3));
  return { rAnkle: r(S.rLeg.ankle), lAnkle: r(S.lLeg.ankle), lBall: r(S.lLeg.ball), rBall: r(S.rLeg.ball), lHand: r(S.lArm.hand), P0: r(S.P0) };
};
window.ready = true;
</script></body></html>
