<!DOCTYPE html>
<html lang="zh-Hant-TW"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light"><meta name="theme-color" content="#1B3240">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="港湖行政">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/app/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/app/icon-192.png">
<link rel="manifest" href="assets/app/admin.webmanifest">
<script>if(/coach\.html$/i.test(location.pathname)){document.querySelector('link[rel=manifest]').href='assets/app/coach.webmanifest';
document.querySelector('meta[name=apple-mobile-web-app-title]').content='港湖教練';document.title='港湖特訓班｜教練';}</script>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>港湖特訓班｜行政管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light only;
--navy:#1B3240;--navy2:#294A5C;--ink:#15242E;--ink2:#37525F;--muted:#6E8794;
--paper:#F5F3EC;--card:#fff;--line:#E4E1D6;--line2:#F0EDE4;
--or:#FE7F2D;--or-d:#A8490A;--or-s:#FFF1E3;
--yellow:#FCCA46;--sage:#A1C181;--teal:#4E8676;--teal-s:#E9F1EE;
--red:#C0392B;--red-s:#FBE9E6;--green:#2C7A52;--green-s:#E8F2EA;
--r:14px;--sh:0 1px 2px rgba(21,36,46,.05),0 4px 14px rgba(21,36,46,.05)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);
font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
font-size:15px;line-height:1.65;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.num{font-family:Oswald,"Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums;font-weight:500}
table,.st b,.tag{font-variant-numeric:tabular-nums}

/* ---------- 頁首 ---------- */
header{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;
padding:calc(11px + env(safe-area-inset-top)) 18px 11px;display:flex;align-items:center;gap:11px;
box-shadow:inset 0 -3px 0 var(--or)}
.mark{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:var(--or);
display:grid;place-items:center}
.mark svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.7}
header h1{font-size:16px;font-weight:800;letter-spacing:.02em}
header .sub{font-size:11px;opacity:.6;letter-spacing:.08em;text-transform:uppercase}
.syncp{margin-left:auto;border:0;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;
padding:5px 11px;border-radius:999px;display:flex;align-items:center;gap:6px;
background:rgba(255,255,255,.13);color:rgba(255,255,255,.8)}
.syncp i{width:7px;height:7px;border-radius:50%;background:currentColor;font-style:normal;flex:0 0 7px}
.syncp.ok{background:rgba(161,193,129,.22);color:#C6E0AE}
.syncp.ing{background:rgba(252,202,70,.2);color:var(--yellow)}
.syncp.pend{background:rgba(254,127,45,.22);color:#FFC08A}
.syncp.err{background:rgba(192,57,43,.3);color:#FFB3A8}
.syncp.ing i{animation:bl .9s ease-in-out infinite}
@keyframes bl{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.syncp.ing i{animation:none}}
.ico{background:#F2F0E8;border:1px solid var(--line);border-radius:9px;width:38px;height:38px;
cursor:pointer;display:grid;place-items:center;padding:0;flex:0 0 38px}
.ico svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ico.on{background:var(--green-s);border-color:#BBDCC4}
.ico.on svg{stroke:var(--green)}
.tel{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--teal);text-decoration:none}

.wrap{max-width:920px;margin:0 auto;padding:16px 15px 8px}

/* ---------- 底部分頁 ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);
backdrop-filter:saturate(1.6) blur(12px);border-top:1px solid var(--line);
display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;background:none;border:0;font-size:11px;color:var(--muted);font-weight:700;
display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;cursor:pointer;
font-family:inherit;border-radius:11px;transition:color .15s,background .15s}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;
stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--or-d);background:var(--or-s)}

/* ---------- 記分板（總覽主視覺） ---------- */
.board{background:var(--navy);border-radius:var(--r);padding:15px 16px 14px;color:#fff;
box-shadow:var(--sh);position:relative;overflow:hidden}
.board::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
background:linear-gradient(90deg,var(--or) 0 34%,var(--yellow) 34% 67%,var(--sage) 67% 100%)}
.board .cap{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.board .cap b{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;font-weight:600}
.board .cap span{font-size:12px;opacity:.75;margin-left:auto}
.bg3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:rgba(255,255,255,.12);
border-radius:10px;overflow:hidden}
.bg3 div{background:var(--navy2);padding:11px 8px;text-align:center}
.bg3 small{display:block;font-size:11px;opacity:.7;margin-bottom:2px}
.bg3 b{font-size:21px;font-weight:600;letter-spacing:-.01em}
.bg3 .hi{color:var(--yellow)}

/* ---------- 卡片 / 區塊 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
padding:15px;margin-bottom:12px;box-shadow:var(--sh)}
h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin-bottom:3px}
.hint{font-size:13px;color:var(--muted);margin-bottom:14px}
.sec-t{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;color:var(--muted);
margin:20px 0 8px;letter-spacing:.1em}
.sec-t{scroll-margin-top:64px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* ---------- 表單 ---------- */
label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:13px 0 5px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
font-size:16px;font-family:inherit;background:#fff;color:var(--ink);appearance:none}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236E8794' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>");
background-repeat:no-repeat;background-position:right 13px center;padding-right:34px}
select[multiple]{background-image:none;padding-right:12px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--or);box-shadow:0 0 0 3px var(--or-s)}
button.btn{background:var(--or);color:#fff;border:0;border-radius:999px;padding:12px 22px;
font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
box-shadow:0 2px 8px rgba(254,127,45,.28)}
button.btn:active{transform:translateY(1px)}
button.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
button.btn.nav{background:var(--navy);color:#fff;box-shadow:none}
button.btn.dan{background:var(--red);box-shadow:none}
button.btn.sm{padding:8px 15px;font-size:13px}
button.btn.full{width:100%;display:flex;align-items:center;justify-content:center;gap:7px}
button.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ---------- 統計小卡 ---------- */
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
box-shadow:var(--sh);position:relative;padding-left:16px}
.st::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:4px;
border-radius:0 4px 4px 0;background:var(--teal)}
.st small{display:block;font-size:12px;color:var(--muted)}
.st b{font-size:20px;font-weight:600;font-family:Oswald,"Noto Sans TC",sans-serif}
.st.or::before{background:var(--or)}.st.red::before{background:var(--red)}
.st.sage::before{background:var(--sage)}.st.yl::before{background:var(--yellow)}

/* ---------- 列表項目 ---------- */
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
margin-bottom:9px;box-shadow:var(--sh);cursor:pointer;transition:border-color .15s}
.item:active{border-color:var(--or)}
.item .top{display:flex;align-items:flex-start;gap:10px}
.item .nm{font-weight:800;font-size:16px;line-height:1.4}
.item .meta{font-size:13px;color:var(--muted);margin-top:2px}
.item .acts{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.item.warn{border-left:4px solid var(--red)}
.item.pl{border-left:4px solid var(--teal)}

.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;
background:var(--or-s);color:var(--or-d);white-space:nowrap}
.tag.g{background:var(--green-s);color:var(--green)}
.tag.r{background:var(--red-s);color:var(--red)}
.tag.b{background:#E8EFF3;color:#2F5D77}
.tag.t{background:var(--teal-s);color:var(--teal)}
.warnline{color:var(--red);font-weight:700}
.mini{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.7}

/* ---------- 彈出表單 ---------- */
.modal{position:fixed;inset:0;background:rgba(21,36,46,.5);z-index:100;display:none;
align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:920px;max-height:93vh;overflow-y:auto;
border-radius:20px 20px 0 0;padding:8px 16px calc(30px + env(safe-area-inset-bottom));
animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.grip{width:38px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 6px}
.sheet .close{position:sticky;top:0;display:flex;align-items:center;gap:8px;background:var(--paper);
padding:6px 0 10px;z-index:2}
.sheet h3{font-size:18px;font-weight:800}
.sheet .close button{margin-left:auto}
.fbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:2px 13px 14px;margin-top:10px}
.fbox>.ttl{font-size:12px;font-weight:800;color:var(--or-d);letter-spacing:.06em;
margin:13px 0 0;padding-top:2px}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line2);padding:9px 4px;text-align:center}
th{background:#F3F1E9;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
.tt{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tt table{min-width:820px;table-layout:fixed}
.tt th:first-child,.tt td:first-child{width:62px}
.tt th,.tt td{width:108px}
.tt td{vertical-align:top;padding:5px 3px}
.tt th:first-child,.tt td:first-child{position:sticky;left:0;background:#F3F1E9;z-index:1}
.slot{background:var(--teal);color:#fff;border-radius:8px;padding:6px;font-size:11px;
font-weight:700;margin-bottom:5px;line-height:1.35;height:52px;overflow:hidden;
display:flex;flex-direction:column;justify-content:center}
.slot.grp{background:var(--or)}
.slot{cursor:pointer}.slot:hover,.slot:focus-visible{filter:brightness(1.08);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--teal)}
.slot.grp:hover,.slot.grp:focus-visible{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--or)}
.slot b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot i{font-style:normal;font-weight:500;opacity:.88;font-size:10px;margin-left:3px}
.slot small{display:block;font-weight:400;opacity:.92;font-size:10px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt th small{font-weight:400;color:#9AA9B2}
.free{display:block;background:var(--green-s);color:var(--green);border-radius:6px;padding:3px 4px;margin:2px 0;font-weight:700;font-size:12px}

.empty{text-align:center;color:var(--muted);padding:30px 16px;font-size:14px;
background:var(--card);border:1px dashed var(--line);border-radius:12px}
.warnbar{background:var(--or-s);border:1px solid #FFD4AC;border-radius:12px;padding:11px 13px;
font-size:13px;color:var(--or-d);margin-bottom:12px;font-weight:600}
.filt{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.filt button{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;
padding:7px 15px;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
.filt button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- 重複排課 ---------- */
.dows{display:flex;gap:5px}
.dows button{flex:1;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 0;
font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
.dows button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.repbox{background:#FBFAF4;border:1px solid var(--line);border-radius:12px;padding:2px 13px 14px;margin-top:10px}
.prev{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-top:11px;
font-size:12px;color:var(--ink2);line-height:1.75;max-height:140px;overflow-y:auto}
.prev b{color:var(--or-d)}
.split{background:var(--or-s);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:12px;
color:var(--or-d);line-height:1.75}
.buy{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-top:9px;background:#fff;
cursor:pointer;display:flex;align-items:flex-start;gap:10px}
/* 迷你行事曆 */
.mc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 10px 12px;margin-top:8px}
.mc-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mc-h b{flex:1;text-align:center;font-size:15px;font-weight:800}
.mc-h button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;
font-size:16px;color:var(--ink2);cursor:pointer;font-family:inherit;line-height:1}
.mc-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mc-g span{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:3px 0}
.mc-g button{aspect-ratio:1;border:1px solid transparent;border-radius:9px;background:#fff;
font-size:15px;font-family:Oswald,inherit;font-weight:500;color:var(--ink);cursor:pointer;padding:0}
.mc-g button.o{color:#C9C6BC}
.mc-g button.t{border-color:var(--or);color:var(--or-d);font-weight:600}
.mc-g button.on{background:var(--or);color:#fff;border-color:var(--or)}
.mc-g button.busy{background:#F3F1E9;color:var(--muted)}
.mc-g button i{font-style:normal;font-size:10px;vertical-align:super;margin-left:1px;opacity:.9}
.mc-g button.off{background:var(--red-s);color:#C88C84}
.mc-g button.on.off{background:var(--red);color:#fff;border-color:var(--red)}
.lgd{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-size:11px;color:var(--muted)}
.lgd span{display:flex;align-items:center;gap:5px}
.lgd b{width:11px;height:11px;border-radius:3px;display:inline-block}
.mc-g button.on.busy{background:var(--or);color:#fff}
.mc-g button:disabled{opacity:.25;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{background:var(--teal-s);color:var(--teal);border:1px solid #CFE3DC;border-radius:999px;
padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.chips button::after{content:" ✕";opacity:.55}
.cnt{display:flex;align-items:baseline;gap:8px;margin-top:12px;font-size:13px;color:var(--ink2)}
.cnt b{font-family:Oswald,inherit;font-size:22px;font-weight:600;color:var(--or-d)}
.cnt.ok b{color:var(--green)}
.poster{width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin-top:10px}
.seg{display:flex;background:#EDEAE0;border-radius:11px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 0;font-size:14px;
font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:var(--or-d);box-shadow:0 1px 3px rgba(21,36,46,.12)}
.buy .l{font-weight:700;font-size:14px}
.buy .m{font-size:12px;color:var(--muted);margin-top:2px}
.buy .rr{margin-left:auto;text-align:right;flex:0 0 auto}

/* ---------- 提示訊息 ---------- */
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
background:var(--navy);color:#fff;font-size:14px;font-weight:700;padding:10px 18px;border-radius:999px;
box-shadow:0 6px 20px rgba(21,36,46,.25);opacity:0;pointer-events:none;z-index:200;
transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 總覽：今天與待辦 ---------- */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 0 12px}
.hello h2{margin:0}
.hello small{display:block;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.todo{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:6px}
.todo button{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:12px;
padding:10px 11px;cursor:pointer;font-family:inherit;text-align:left;box-shadow:var(--sh);color:var(--ink)}
.todo button svg{width:20px;height:20px;flex:0 0 20px;stroke:var(--muted);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.todo button b{font-family:Oswald,inherit;font-size:20px;font-weight:600;line-height:1}
.todo button small{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.todo button.hot{border-color:#FFD4AC;background:var(--or-s)}
.todo button.hot svg{stroke:var(--or-d)}.todo button.hot b{color:var(--or-d)}
.todo button.red{border-color:#F2C6C0;background:var(--red-s)}
.todo button.red svg{stroke:var(--red)}.todo button.red b{color:var(--red)}
.todo button.ok b{color:var(--muted)}
.todo.t3{grid-template-columns:repeat(3,1fr)}
.todo.t3 button{flex-direction:column;align-items:flex-start;gap:4px;padding:10px 9px}
.todo.t3 button small{font-size:10.5px}
.item.today{border-left:4px solid var(--or)}
.item.rn{border-left:4px solid var(--yellow)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.qa button{display:flex;align-items:center;justify-content:center;gap:7px}
@media(hover:hover){.item:hover{border-color:#D3CFC2}.todo button:hover{border-color:var(--or)}}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700;
color:var(--ink2);cursor:pointer;font-family:inherit}
.pick.on{background:var(--teal);border-color:var(--teal);color:#fff}
details.recst>summary{cursor:pointer;padding:12px 0 2px;margin:0}
details.recst>summary::after{content:" ▾";color:var(--muted)}details.recst[open]>summary::after{content:" ▴"}
.recv{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-top:9px;background:#fff}
.recv>summary{cursor:pointer}.recv .l{font-weight:700;font-size:14px}.recv .m{font-size:12px;color:var(--muted);margin-top:2px}
.recv[open]{background:#FBFAF6}

function mergeIn(recs){
 PCOLS.forEach(function(col){
  (recs[col]||[]).forEach(function(r){
   if(PEND[col]&&PEND[col][r.id])return;               // 本機還有沒送出的改動，先不要蓋掉
   var o=r.data||{};o.id=r.id;o.ts=r.ts;o.del=r.del?1:0;
   var cur=byId(DB[col],r.id);
   if(!cur&&col==='students'&&o.name){
    // 第一次連雲端時，把同名、從未編輯過的預設名單清掉，避免整份重複
    for(var q=DB[col].length-1;q>=0;q--){var x=DB[col][q];
     if(x.id!==r.id&&x.name===o.name&&!x.ts&&!PEND[col][x.id])DB[col].splice(q,1);}
   }
   if(!cur)DB[col].push(o);
   else if(r.ts>=(cur.ts||0))DB[col][DB[col].indexOf(cur)]=o;
  });});
 (recs.cfg||[]).forEach(function(r){
  if(PEND.cfg)return;
  if(r.ts>=(DB.cfg.ts||0)){var c=r.data||{};c.ts=r.ts;DB.cfg=c;}});
 applySettings();applyCD();
}

var TB=MODE==='coach'?['students_pub','lessons','cfg','coachdata','summary']:['students','lessons','payments','expenses','cfg','coachdata'];
function syncNow(manual){
 if(!sbReady()){setST('off');
  if(manual)alert('還沒設定資料庫連線。到「結算」分頁最下面填入網址和金鑰。');return;}
 if(!canSync()){setST('off');
  if(manual)alert('還沒登入。到「結算」分頁最下面輸入帳號密碼登入。');return;}
 if(SYNCST==='ing')return;
 setST('ing');

 var snap={cfg:PEND.cfg},jobs=[],cnt=0;
 COLS.forEach(function(col){snap[col]={};
  var rows=[];
  Object.keys(PEND[col]).forEach(function(id){
   var r=byId(DB[col],id);
   if(!r){delete PEND[col][id];return;}
   snap[col][id]=r.ts;
   rows.push({id:r.id,del:r.del?1:0,data:r});
  });
  if(rows.length){cnt+=rows.length;jobs.push(sbPush(col,rows));
   jobs.push(sbPush('audit',auditRows(col,rows)).catch(function(){return false;}));}
 });
 if(PEND.cfg&&MODE!=='coach'){cnt++;jobs.push(sbPush('cfg',[{id:'cfg',del:0,data:DB.cfg}]));}

 Promise.all(jobs)
 .then(function(){return Promise.all(TB.map(function(c){
   return sbPull(c).then(function(j){return {col:c==='students_pub'?'students':c,rows:j};});}));})
 .then(function(res){
  var recs={},maxts=SINCE;
  res.forEach(function(x){
   recs[x.col]=x.rows;
   x.rows.forEach(function(r){if(r.ts>maxts)maxts=r.ts;});});
  mergeIn(recs);
  SYNCED=true;
  SINCE=maxts;save('since',SINCE);
  COLS.forEach(function(col){
   Object.keys(snap[col]).forEach(function(id){
    if(PEND[col][id]===snap[col][id])delete PEND[col][id];});});
  if(snap.cfg&&PEND.cfg===snap.cfg)PEND.cfg=0;
  LASTSYNC=new Date().toTimeString().slice(0,5);save('lastsync',LASTSYNC);
  if(MODE!=='coach'){applyCD();autoComplete();}
  persistOnly();SYNCMSG='';setST('ok');render();
  if(MODE!=='coach'){
   if(pendCount())setTimeout(function(){syncNow();},800);
   else{pushSummary();dailyBackup();}}
  if(manual)alert('同步完成，'+(cnt?'送出 '+cnt+' 筆變更。':'沒有新的變更。'));
 })
 .catch(function(e){
  SYNCMSG=String(e.message||e);setST('err');upPill();
  if(manual)alert('同步失敗\n\n'+SYNCMSG);
 });
}

/* coachdata 表：教練寫的東西都放這裡，教練帳號只能寫這張表。
   rec:課程id＝上課紀錄、test:檢測id＝檢測、prof:姓名＝基本資料、old:姓名＝舊 Excel 匯入的紀錄、req:id＝教練的申請。
   畫面上照舊用 l.rec、s.tests、s.profile、s.oldRecs，但這些欄位設成「不寫回課程／學員表」 */
function hide(o,k,v){Object.defineProperty(o,k,{value:v,writable:true,enumerable:false,configurable:true});}
function isOwn(o,k){return Object.prototype.propertyIsEnumerable.call(o,k);}
function cdRow(id){return byId(DB.coachdata,id);}
function cdPut(id,fields){var r=cdRow(id);if(!r){r={id:id};DB.coachdata.push(r);}
 for(var k in fields)r[k]=fields[k];r.del=0;touch('coachdata',r);return r;}
function cdDel(id){var r=cdRow(id);if(r){r.del=1;touch('coachdata',r);}}
function applyCD(){
 var rec={},tests={},prof={},old={};
 (DB.coachdata||[]).forEach(function(r){if(r.del)return;
  if(r.k==='rec')rec[r.lid]=r.rec;
  else if(r.k==='test')(tests[r.stu]=tests[r.stu]||[]).push(r.t);
  else if(r.k==='prof')prof[r.stu]=r.p;
  else if(r.k==='old')old[r.stu]=r.list;});
 /* 舊資料還放在課程／學員表裡的：行政端同步完才搬到 coachdata（先搬再藏，避免存檔時弄丟）；其他情況先原樣保留 */
 var mig=MODE==='admin'&&SYNCED;
 DB.lessons.forEach(function(l){
  if(isOwn(l,'rec')){if(!mig)return;var v=l.rec;delete l.rec;touch('lessons',l);
   if(v&&!rec.hasOwnProperty(l.id)){cdPut('rec:'+l.id,{k:'rec',lid:l.id,rec:v});rec[l.id]=v;}}
  hide(l,'rec',rec[l.id]);});
 DB.students.forEach(function(s){
  var ch=false;
  [['tests',tests],['profile',prof],['oldRecs',old]].forEach(function(x){var k=x[0],m=x[1];
   if(isOwn(s,k)){if(!mig)return;var v=s[k];delete s[k];ch=true;
    if(!m.hasOwnProperty(s.name)&&v&&(!Array.isArray(v)||v.length)){
     if(k==='tests')v.forEach(function(t){cdPut('test:'+t.id,{k:'test',stu:s.name,t:t});});
     if(k==='profile')cdPut('prof:'+s.name,{k:'prof',stu:s.name,p:v});
     if(k==='oldRecs')cdPut('old:'+s.name,{k:'old',stu:s.name,list:v});
     m[s.name]=v;}}
   hide(s,k,m.hasOwnProperty(s.name)?m[s.name]:(k==='tests'?[]:undefined));});
  if(ch)touch('students',s);});
}
/* 行政端第一次跑新版：把舊的上課紀錄、檢測、基本資料從課程／學員表搬到 coachdata */
function migrateCD(){
 if(MODE!=='admin')return 0;var n=0;
 DB.lessons.forEach(function(l){if(isOwn(l,'rec')){var v=l.rec;delete l.rec;
  if(v&&!cdRow('rec:'+l.id))cdPut('rec:'+l.id,{k:'rec',lid:l.id,rec:v});touch('lessons',l);n++;}});
 DB.students.forEach(function(s){var ch=false;
  if(isOwn(s,'tests')){var ts=s.tests;delete s.tests;ch=true;(ts||[]).forEach(function(t){if(!cdRow('test:'+t.id))cdPut('test:'+t.id,{k:'test',stu:s.name,t:t});});}
  if(isOwn(s,'profile')){var p=s.profile;delete s.profile;ch=true;if(p&&!cdRow('prof:'+s.name))cdPut('prof:'+s.name,{k:'prof',stu:s.name,p:p});}
  if(isOwn(s,'oldRecs')){var o=s.oldRecs;delete s.oldRecs;ch=true;if(o&&o.length&&!cdRow('old:'+s.name))cdPut('old:'+s.name,{k:'old',stu:s.name,list:o});}
  if(ch){touch('students',s);n++;}});
 return n;
}
function setRec(l,rec){if(rec)cdPut('rec:'+l.id,{k:'rec',lid:l.id,rec:rec});else cdDel('rec:'+l.id);hide(l,'rec',rec||undefined);}
function setProf(s,p){cdPut('prof:'+s.name,{k:'prof',stu:s.name,p:p});hide(s,'profile',p);}
function setTest(s,t){cdPut('test:'+t.id,{k:'test',stu:s.name,t:t});
 var a=(s.tests||[]).filter(function(x){return x.id!==t.id;});a.push(t);hide(s,'tests',a);}
function delTest(s,id){cdDel('test:'+id);hide(s,'tests',(s.tests||[]).filter(function(x){return x.id!==id;}));}
function setOld(s,list){if(list&&list.length)cdPut('old:'+s.name,{k:'old',stu:s.name,list:list});else cdDel('old:'+s.name);hide(s,'oldRecs',list);}

 return (l?md(l.date)+'（'+DAYN[dowOf(l.date)].slice(1)+'）'+l.start+'–'+l.end+'　'+esc((l.students||[]).join('、'))+'　':'（課程已刪除）')
  +'<b>'+esc(REQ_T[r.type]||r.type)+'</b>'+(r.nm?'：'+esc(r.nm):'')
  +(r.type==='time'&&r.to?'：'+esc(r.from||'')+' → '+esc(r.to.start+'–'+r.to.end):'');}

 if(ok&&l){
  if(r.type==='done'){if(l.date<=today())l.status='已完成';}

   l.gapOk=l.gapOk||[];if(l.gapOk.indexOf(r.nm)<0)l.gapOk.push(r.nm);fixGroupPlan(l);}
  if(r.type==='stuBack'){
   l.leave=(l.leave||[]).filter(function(x){return x.n!==r.nm;});
   if(l.students.indexOf(r.nm)<0)l.students.push(r.nm);
   l.gapOk=(l.gapOk||[]).filter(function(x){return x!==r.nm;});fixGroupPlan(l);}
  if(r.type==='time'&&r.to){l.adj={from:l.start+'–'+l.end,by:r.by,at:today(),ok:1};l.start=r.to.start;l.end=r.to.end;}
  touch('lessons',l);}
 cdPut(r.id,{st:ok?'ok':'no',dec:recWho(),decAt:Date.now()});
}

/* ============ 課表 ============ */
var calMon=(function(){var d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);})();
function vCal(){
 var days=[];
 for(var i=0;i<7;i++)days.push(addD(calMon,i));
 var slots=usedSlots(days),hours=[];
 slots.forEach(function(t){var h=t.slice(0,2);if(hours.indexOf(h)<0)hours.push(h);});
 hours.sort();
 var cellOf=function(ds,h){
  return LES().filter(function(l){
    return l.date===ds&&l.status!=='取消'&&l.start.slice(0,2)===h;})
   .sort(function(a,b){return a.start<b.start?-1:1;})
   .map(function(l){
    var g=l.plan.indexOf('團班')===0,half=l.start.slice(3)!=='00',odd=durMin(l)!==60;
    return '<div class="slot'+(g?' grp':'')+'" data-edit="les" data-id="'+l.id+'" role="button" tabindex="0" title="'+esc(l.start+'–'+l.end)+'　點一下可以改時間或延課">'
     +'<b>'+esc(l.coach)+(odd?'<i>'+esc(l.start+'–'+l.end)+'</i>':(half?'<i>'+esc(l.start)+' 起</i>':''))+'</b>'
     +'<small>'+esc(l.students.join('、'))+'</small></div>';}).join('');
 };
 var rows=hours.map(function(h){
  var tds=days.map(function(ds){return '<td>'+cellOf(ds,h)+'</td>';}).join('');
  return '<tr><th>'+h+':00</th>'+tds+'</tr>';}).join('');
 return '<h2>週課表</h2><div class="hint">'+calMon.replace(/-/g,'/')+' 起這一週已排定的課。點課程可以直接改時間、換教練或延課。</div>'

 +'<button class="btn sec sm" data-act="thisw">本週</button>'
 +'<button class="btn sec sm" data-act="nextw">下一週 →</button></div>'
 +'<label>直接指定該週星期一</label><input type="date" id="mon" value="'+calMon+'"></div>'
 +'<div class="card tt" style="padding:10px"><table><tr><th>時段</th>'
 +days.map(function(ds){return '<th>'+DAYN[dowOf(ds)].slice(1)+'<br><small style="font-weight:400">'
   +(+ds.slice(5,7))+'/'+(+ds.slice(8))+'</small></th>';}).join('')
 +'</tr>'+rows+'</table></div>'
 +'<div class="card"><button class="btn full" data-act="poster">'+svg('cal',16)+' 匯出這週課表圖片</button>'
 +'<div class="mini">產生一張可以直接貼到 LINE 群組的課表圖。綠色是個別課，橘色是團班。'
 +'每個整點一列，不是整點開始的課會在教練名字旁標出時間。</div></div>'
 +'<div class="sec-t">教練可排時段</div>'
 +'<div class="card tt" style="padding:10px"><table><tr><th>教練</th>'
 +[1,2,3,4,5,6].map(function(w){return '<th>'+DAYN[w].slice(1)+'</th>';}).join('')+'</tr>'
 +COACHES.map(function(c){
   return '<tr><td style="font-weight:700">'+c+'</td>'
   +[1,2,3,4,5,6].map(function(w){
     var t=availText(c,w);
     return '<td style="'+(t==='—'?'color:var(--muted)':'')+'">'+t+'</td>';}).join('')+'</tr>';}).join('')
 +'</table></div>'
 +'<div class="sec-t">教練剩下可排的時段（'+md(days[0])+'–'+md(days[5])+' 這一週）</div>'
 +'<div class="card tt" style="padding:10px"><table><tr><th>教練</th>'
 +[1,2,3,4,5,6].map(function(w){return '<th>'+DAYN[w].slice(1)+'<br><small style="font-weight:400">'+md(days[w-1])+'</small></th>';}).join('')+'</tr>'
 +COACHES.map(function(c){
   var tot=0;
   var tds=[1,2,3,4,5,6].map(function(w){
     var ds=days[w-1],win=availOf(c,w);
     if(!win.length)return '<td style="color:var(--muted)">—</td>';
     var fr=freeSlots(c,ds);

/* 剩下 RENEW_AT 堂以內就出現在總覽。s.renewAsk＝{d:傳訊息日期,b:當時總堂數}；s.renewOff＝按「先不提醒」時的總堂數，之後有續購就會再出現 */
var RENEW_AT=2;
function renewList(){
 return STU().filter(function(s){
  var b=boughtOf(s.name);
  return b>0&&leftOf(s.name)<=RENEW_AT&&!(s.renewOff&&+s.renewOff===b);})
  .sort(function(a,b){
   var aa=renewAsked(a)?1:0,bb=renewAsked(b)?1:0;
   return aa!==bb?aa-bb:leftOf(a.name)-leftOf(b.name);});
}
function renewAsked(s){return s.renewAsk&&+s.renewAsk.b===boughtOf(s.name)?s.renewAsk.d:'';}
/* 目前這一期（最早還沒用完的那筆繳費）以及這期上過的課 */
function curPack(name){
 /* 同一天繳的幾筆（例如兩筆單堂）當成同一期 */
 var bs=[];
 buysOf(name).slice().sort(function(a,b){return (a.date||'')<(b.date||'')?-1:1;}).forEach(function(p){
  var q=bs[bs.length-1];
  if(q&&q.date===p.date){q.sessions=(+q.sessions||0)+(+p.sessions||0);if(q.plan!==p.plan&&q.plan.indexOf(p.plan)<0)q.plan+='＋'+p.plan;}
  else bs.push({date:p.date,plan:p.plan||'',sessions:+p.sessions||0});});
 var used=doneCount(name),cum=0,pk=null,start=0;
 for(var i=0;i<bs.length;i++){
  var n=+bs[i].sessions||0;
  if(cum+n>used||i===bs.length-1){pk=bs[i];start=cum;break;}
  cum+=n;}
 var run=0,ls=[];
 lessonsOf(name).filter(function(l){return l.status==='已完成';}).forEach(function(l){
  var u=unitsOf(l);if(run+u>start)ls.push(l);run+=u;});
 return {buy:pk,lessons:ls};
}
/* 同一天、時間接在一起的課併成一行（例如 15:00–16:00＋16:00–17:00 → 15:00–17:00） */
function mergeDays(ls){
 var out=[];
 ls.slice().sort(function(a,b){return (a.date+a.start)<(b.date+b.start)?-1:1;}).forEach(function(l){
  var p=out[out.length-1];
  if(p&&p.date===l.date&&t2m(l.start)<=t2m(p.end)){
   if(t2m(l.end)>t2m(p.end))p.end=l.end;p.u+=unitsOf(l);p.min+=durMin(l);}
  else out.push({date:l.date,start:l.start,end:l.end,u:unitsOf(l),min:durMin(l),coach:l.coach});});
 return out;
}

function attSet(l,what,nm){
 var t0=today();
 if(MODE==='coach'){
  if(what==='done'&&l.date>t0)return alert('日期還沒到，上完課再標記');
  if(what==='leave'&&!confirm('送出「整堂請假、之後補課」的申請？行政同意後課表才會改。'))return;
  if(what==='stuLeave'&&(l.students||[]).length<=1)what='leave';
  makeReq(l,what,{nm:nm||''});persist();
  var bx=document.getElementById('attbox');if(bx){bx.outerHTML=attBlock(l);bind();}
  toast('已送出，等行政確認');return;}
 if(what==='done'){if(l.date>t0)return alert('日期還沒到，上完課再標記');l.status='已完成';}
 if(what==='leave'){if(!confirm((l.students||[]).length>1?'整堂（'+l.students.join('、')+'）都請假、之後補課？':'這堂請假、之後補課？'))return;l.status='請假改期';}
 var stuChange=what==='stuLeave'||what==='stuBack',draft=stuChange?readRecForm():null;
 if(what==='stuLeave'){
  if((l.students||[]).length<=1)return attSet(l,'leave');
  l.students=l.students.filter(function(x){return x!==nm;});
  l.leave=(l.leave||[]).filter(function(x){return x.n!==nm;});l.leave.push({n:nm,by:recWho(),at:today()});
  l.gapOk=l.gapOk||[];if(l.gapOk.indexOf(nm)<0)l.gapOk.push(nm);
  fixGroupPlan(l);}
 if(what==='stuBack'){
  l.leave=(l.leave||[]).filter(function(x){return x.n!==nm;});
  if(l.students.indexOf(nm)<0)l.students.push(nm);
  l.gapOk=(l.gapOk||[]).filter(function(x){return x!==nm;});
  fixGroupPlan(l);}
 l.att={by:recWho(),at:Date.now()};
 touch('lessons',l);persist();render();
 if(stuChange){var dirty=REC_DIRTY;REC_CUR=0;fRec(l.id,draft);REC_DIRTY=dirty;}
 else{var box=document.getElementById('attbox');if(box){box.outerHTML=attBlock(l);bind();}}
 toast(what==='done'?'已標記有上課':(what==='stuBack'?nm+' 改回有到':'已標記請假'));
}

/* ---- 修復工具 ---- */
/* 同教練、同日、同時段的課程分組（撞時段） */
function clashGroups(){
 var map={};
 LES().forEach(function(l){
  if(l.status==='取消')return;
  var k=l.coach+'|'+l.date+'|'+l.start;
  (map[k]=map[k]||[]).push(l);});
 return Object.keys(map).map(function(k){return map[k];})
  .filter(function(g){return g.length>1;});
}
/* 把一組撞時段的課合併成一堂：以團班那堂為主，名單合在一起 */
function mergeGroup(g){
 g.sort(function(a,b){
  var fa=planFam(a.plan)==='g'?0:(planFam(a.plan)==='d'?1:2);
  var fb=planFam(b.plan)==='g'?0:(planFam(b.plan)==='d'?1:2);
  if(fa!==fb)return fa-fb;
  return (b.students||[]).length-(a.students||[]).length;});
 var t=g[0];
 t.students=(t.students||[]).slice();
 g.slice(1).forEach(function(x){
  (x.students||[]).forEach(function(n){if(t.students.indexOf(n)<0)t.students.push(n);});
  if(x.status==='已完成')t.status='已完成';
  x.del=1;touch('lessons',x);});
 if(t.students.length>2&&planFam(t.plan)!=='g')t.plan='團班4人';
 fixGroupPlan(t);
 touch('lessons',t);
 return t;
}
/* 同教練、同星期、同時段的團班／一對二視為同一個系列 */
function seriesKey(l){return l.coach+'|'+dowOf(l.date)+'|'+l.start+'|'+planFam(l.plan);}
/* 已確認沒有上課、不用再提醒的場次（只記場次，不寫學員姓名） */
var GAP_OK_SESSIONS={'2026-11-12|19:30|陳凱文':1};
function gapOk(l,n){return !!GAP_OK_SESSIONS[l.date+'|'+l.start+'|'+l.coach]||(l.gapOk||[]).indexOf(n)>=0;}
/* 找出系列裡名單比別堂少的課 */
function rosterGaps(){
 var map={};
 LES().forEach(function(l){
  if(l.status==='取消'||planFam(l.plan)==='s')return;
  var k=seriesKey(l);(map[k]=map[k]||[]).push(l);});
 var out=[];
 Object.keys(map).forEach(function(k){
  var g=map[k];if(g.length<2)return;
  var all={},first={};
  g.forEach(function(l){(l.students||[]).forEach(function(n){
   all[n]=(all[n]||0)+1;
   if(!first[n]||l.date<first[n])first[n]=l.date;});});
  /* 以「出現在半數以上堂數」的人當作這一班的固定成員 */
  var core=Object.keys(all).filter(function(n){return all[n]*2>g.length;});
  if(!core.length)return;
  g.forEach(function(l){
   /* 他第一次出現在這班之前的課不算缺人（還沒加入） */
   var miss=core.filter(function(n){return l.date>first[n]&&(l.students||[]).indexOf(n)<0&&!gapOk(l,n);});
   if(miss.length)out.push({l:l,miss:miss});});
 });
 return out.sort(function(a,b){return a.l.date<b.l.date?-1:1;});
}

/* 這位學員可能漏登的課：同教練、同星期、同時段的團班／一對二，日期已過，名單裡沒有他 */
function missedOf(name){
 var mine=lessonsOf(name).filter(function(l){return planFam(l.plan)!=='s';});
 if(!mine.length)return [];
 var keys={};
 mine.forEach(function(l){keys[l.coach+'|'+dowOf(l.date)+'|'+l.start]=1;});
 var t=today();
 return LES().filter(function(l){
  return l.status==='已完成'&&l.date<t&&planFam(l.plan)!=='s'
   &&keys[l.coach+'|'+dowOf(l.date)+'|'+l.start]
   &&(l.students||[]).indexOf(name)<0&&!gapOk(l,name);})
  .sort(function(a,b){return a.date<b.date?-1:1;});
}

/* ============ 迷你行事曆（多選上課日期）============ */
/* CALSEL 每一筆是一堂課：{d 日期, s 開始, e 結束} */
var CALSEL=[],CALM='';
function calSort(){CALSEL.sort(function(a,b){return (a.d+a.s)<(b.d+b.s)?-1:1;});}
function calInit(list){
 CALSEL=(list||[]).slice();calSort();
 CALM=((CALSEL[0]||{}).d||today()).slice(0,7);
}
function calOn(ds){return CALSEL.filter(function(x){return x.d===ds;});}
/* 一次加入「每次上課堂數」堂，時段接著排下去 */
function calPer(){return Math.max(1,Math.min(4,+val('f_per')||1));}
function calDur(){return Math.max(30,+val('f_dur')||60);}
/* 每堂時間選項；一對一、一對二 30 分鐘算 0.5 堂，團班不論時長都是 1 堂 */
var DUROPTS=[[30,'30 分鐘（0.5 堂）'],[60,'60 分鐘（1 堂）'],[90,'90 分鐘（1.5 堂）'],[120,'120 分鐘（2 堂）']];
/* 行事曆上每選一格算幾堂（團班一格就是 1 堂） */
function slotUnits(){
 var p=val('f_plan')||val('b_plan')||'';
 if(isGrpPlan(p))return 1;
 return Math.max(0.5,Math.round(calDur()/30)/2);
}
function addDay(ds){
 var base=t2m(val('f_start')||'18:00'),dur=calDur();
 for(var k=0;k<calPer();k++){
  var s=m2t(base+k*dur),e=m2t(base+(k+1)*dur);
  if(!CALSEL.some(function(x){return x.d===ds&&x.s===s;}))CALSEL.push({d:ds,s:s,e:e});
 }
}
var CALONE=false;
function calBlock(one){
 CALONE=!!one;
 return '<div class="mc" id="mc"></div>'
 +(one?''
   :'<div class="row" style="margin-top:10px">'
    +'<button class="btn sec sm" data-act="calweek">每週同一天排滿</button>'
    +'<button class="btn sec sm" data-act="cal2week">每兩週排滿</button>'
    +'<button class="btn sec sm" data-act="calclear">清空</button></div>')
 +'<div class="chips" id="calchips"></div>'
 +'<div class="cnt" id="calcnt"></div>';
}
function drawCal(){
 var box=document.getElementById('mc');if(!box)return;
 var y=+CALM.slice(0,4),m=+CALM.slice(5,7);
 var first=new Date(y,m-1,1),lead=first.getDay();
 var last=new Date(y,m,0).getDate();
 var h='<div class="mc-h"><button type="button" data-act="calprev">‹</button>'
  +'<b>'+y+' 年 '+m+' 月</b>'
  +'<button type="button" data-act="calnext">›</button></div><div class="mc-g">'
  +DAYN.map(function(n){return '<span>'+n.slice(1)+'</span>';}).join('');
 for(var i=0;i<lead;i++)h+='<button type="button" disabled></button>';
 var co=val('f_coach'),st=val('f_start');
 for(var d=1;d<=last;d++){
  var ds=CALM+'-'+String(d).padStart(2,'0');
  var mine=calOn(ds);
  var busy=co&&LES().some(function(l){
   return l.status!=='取消'&&l.coach===co&&l.date===ds&&l.start===st;});
  var off=co&&!inAvail(co,ds,st,m2t(t2m(st)+calDur()));
  h+='<button type="button" class="'+(mine.length?'on ':'')+(busy?'busy ':'')+(off?'off ':'')
   +(ds===today()?'t':'')+'" data-d="'+ds+'" title="'+(off?'不在可排時段':'')+'">'
   +d+(mine.length>1?'<i>'+mine.length+'</i>':'')+'</button>';
 }
 h+='</div><div class="lgd">'
  +'<span><b style="background:var(--or)"></b>已選</span>'
  +'<span><b style="background:#F3F1E9;border:1px solid var(--line)"></b>該教練已有課</span>'
  +'<span><b style="background:var(--red-s)"></b>不在可排時段</span></div>';
 box.innerHTML=h;
 box.querySelectorAll('[data-d]').forEach(function(b){
  b.onclick=function(){
   var ds=b.dataset.d;
   if(CALONE){CALSEL=[];addDay(ds);}
   else if(calOn(ds).length)CALSEL=CALSEL.filter(function(x){return x.d!==ds;});
   else addDay(ds);
   calSort();drawCal();drawChips();};});
 box.querySelector('[data-act="calprev"]').onclick=function(){
  var d=new Date(y,m-2,1);CALM=ymd(d).slice(0,7);drawCal();};
 box.querySelector('[data-act="calnext"]').onclick=function(){
  var d=new Date(y,m,1);CALM=ymd(d).slice(0,7);drawCal();};
}
function drawChips(){
 var c=document.getElementById('calchips'),n=document.getElementById('calcnt');
 if(!c)return;
 c.innerHTML=CALSEL.map(function(o,i){
  return '<button type="button" data-x="'+i+'">'+o.d.slice(5).replace('-','/')
   +'('+DAYN[dowOf(o.d)].slice(1)+') '+o.s+'</button>';}).join('');
 c.querySelectorAll('[data-x]').forEach(function(b){
  b.onclick=function(){CALSEL.splice(+b.dataset.x,1);drawCal();drawChips();};});
 if(n){
  var want=+val('b_n')||0,su=slotUnits(),got=CALSEL.length*su;
  n.className='cnt'+(want&&got===want?' ok':'');
  if(CALONE){
   n.className='cnt'+(CALSEL.length?' ok':'');
   n.innerHTML=CALSEL.length
    ?'改到 <b>'+CALSEL[0].d.replace(/-/g,'/')+'</b>（'+DAYN[dowOf(CALSEL[0].d)]+'）'+CALSEL[0].s+'–'+CALSEL[0].e
    :'請在上面點一個新的日期';
   return;
  }
  var dd={};CALSEL.forEach(function(o){dd[o.d]=1;});
  var nd=Object.keys(dd).length,per=calPer();
  n.className='cnt'+(want&&got===want?' ok':'');
  n.innerHTML='已選 <b>'+got+'</b> 堂'+(su!==1?'（'+CALSEL.length+' 次，每次 '+su+' 堂）':'')+'　'+nd+' 天'+(per>1?'，每次 '+per+' 節':'')
   +(want?'　方案共 '+want+' 堂'+(got===want?'　✓ 剛好'
     :(got<want?'　還差 '+(want-got)+' 堂':'　多了 '+(got-want)+' 堂')):'');
 }
}
/* 改了時間／時長／每次堂數之後，把已選的那幾天用新設定重排一次 */
function recalcDays(){
 if(!document.getElementById('mc'))return;
 if(CALSEL.length){
  var dd=[];CALSEL.forEach(function(o){if(dd.indexOf(o.d)<0)dd.push(o.d);});
  CALSEL=[];dd.forEach(addDay);calSort();
 }
 drawCal();drawChips();
}
/* 以最早選的那天為起點整份重算，按幾次結果都一樣 */
function calFill(step){
 if(!CALSEL.length)return alert('請先在行事曆上點一天，當作第一次上課');
 calSort();
 var first=CALSEL[0].d,per=calPer();
 var su=slotUnits(),want=+val('b_n')||CALSEL.length*su,slots=Math.max(1,Math.floor(want/su+1e-9));
 var days=Math.max(1,Math.ceil(slots/per));
 CALSEL=[];
 var cur=first;
 for(var i=0;i<days;i++){addDay(cur);cur=addD(cur,step);}
 calSort();
 if(CALSEL.length>slots)CALSEL=CALSEL.slice(0,slots);
 CALM=first.slice(0,7);drawCal();drawChips();
}

/* ============ 週課表圖片 ============ */
function makePoster(){
 var days=[];for(var i=0;i<7;i++)days.push(addD(calMon,i));
 var used=usedSlots(days),hours=[];
 used.forEach(function(t){var h=t.slice(0,2);if(hours.indexOf(h)<0)hours.push(h);});
 hours.sort();

 var W=1512,PAD=36,HEAD=196,TC=120,COLH=76,BH=104,GAP=8;
 var CW=(W-PAD*2-TC)/7;
 var F='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';

 function cell(h,ds){
  return LES().filter(function(l){
    return l.status!=='取消'&&l.date===ds&&l.start.slice(0,2)===h;})
   .sort(function(a,b){return a.start<b.start?-1:1;});
 }
 function wrapNames(x,arr,maxW,maxLines){
  if(!arr.length)return ['—'];
  var out=[],cur='';
  for(var i=0;i<arr.length;i++){
   var tryS=cur?cur+'、'+arr[i]:arr[i];
   if(cur&&x.measureText(tryS).width>maxW){
    out.push(cur+'、');
    if(out.length>=maxLines){out[maxLines-1]=cur+'…';return out;}
    cur=arr[i];
   }else cur=tryS;
  }
  if(cur)out.push(cur);
  return out;
 }
 /* 每列高度＝該列最多幾堂 × 固定區塊高度，所有區塊等寬等高 */
 var rowInfo=hours.map(function(h){
  var mx=1;
  days.forEach(function(ds){var n=cell(h,ds).length;if(n>mx)mx=n;});
  return {h:h,n:mx,height:mx*BH+(mx-1)*GAP+24};
 });
 var H=HEAD+COLH+rowInfo.reduce(function(a,r){return a+r.height;},0)+PAD+64;

 var c=document.createElement('canvas');c.width=W;c.height=H;
 var x=c.getContext('2d');
 x.fillStyle='#F5F3EC';x.fillRect(0,0,W,H);
 x.fillStyle='#1B3240';x.fillRect(0,0,W,HEAD-26);
 ['#FE7F2D','#FCCA46','#A1C181'].forEach(function(col,i){
  x.fillStyle=col;x.fillRect(i*W/3,HEAD-26,W/3,10);});
 x.fillStyle='#fff';x.font='700 48px '+F;
 x.fillText('港湖特訓班　本週課表',PAD,88);
 x.fillStyle='rgba(255,255,255,.72)';x.font='400 28px '+F;
 var a0=days[0],b0=days[6];
 x.fillText(a0.slice(0,4)+'/'+a0.slice(5,7)+'/'+a0.slice(8)+' – '+b0.slice(5,7)+'/'+b0.slice(8),PAD,134);

 var top0=HEAD;
 days.forEach(function(ds,i){
  var cx=PAD+TC+i*CW,wk=dowOf(ds);
  x.fillStyle=(wk===0||wk===6)?'#EDE9DC':'#E4E1D6';
  x.fillRect(cx,top0,CW-4,COLH);
  x.fillStyle='#1B3240';x.font='700 27px '+F;x.textAlign='center';
  x.fillText(DAYN[wk],cx+CW/2-2,top0+34);
  x.fillStyle='#6E8794';x.font='500 22px '+F;
  x.fillText((+ds.slice(5,7))+'/'+(+ds.slice(8)),cx+CW/2-2,top0+62);
  x.textAlign='left';
 });

 var y=top0+COLH;
 rowInfo.forEach(function(ri,idx){
  x.fillStyle=idx%2?'#EFEDE6':'#F5F3EC';

/* ---- 期別計算 ---- */
function perRange(pid){return pidRange(pid);}
function perOfDate(ds){return pidOf(ds);}
function lesOfPer(pid){
 return LES().filter(function(l){return l.status!=='取消'&&pidOf(l.date)===pid;})
  .sort(function(a,b){return (a.date+a.start)<(b.date+b.start)?-1:1;});
}
function payOfPer(pid){
 return PAY().filter(function(p){return p.date&&pidOf(p.date)===pid;})
  .sort(function(a,b){return (a.date||'')<(b.date||'')?-1:1;});
}
function perStat(pid){
 var ls=lesOfPer(pid),r=pidRange(pid),n=pid;
 var S=function(k){return ls.reduce(function(a,l){return a+amt(l,k);},0);};
 var ex=expOfPer(pid);
 var o={n:pid,pid:pid,label:pidLabel(pid),short:pidShort(pid),payday:pidPay(pid),
  from:r.from,to:r.to,cnt:nUnits(ls),
  pay:S('pay'),coach:S('coach'),gear:S('gear'),fund:S('fund'),admin:S('admin'),
  cash:payOfPer(pid).reduce(function(a,p){return a+(+p.due||0);},0),ls:ls,
  ex:ex,exOut:expSum(ex,'支出'),exIn:expSum(ex,'收入')};
 o.avail=o.fund-o.admin-o.exOut+o.exIn;
 var rms=reimsOfPer(pid),cs=acctCoaches(ls);
 rms.forEach(function(x){if(cs.indexOf(x.adv)<0)cs.push(x.adv);});
 carryIn(pid).forEach(function(x){if(cs.indexOf(x.target)<0)cs.push(x.target);});
 o.reims=rms;o.reim=reimSum(rms);
 o.byCoach=cs.map(function(c){
  var mine=ls.filter(function(l){return l.coach===c;});
  var fee=mine.reduce(function(a,l){return a+amt(l,'coach');},0);
  var adminGet=(c===ADMIN_TO?o.admin:0);
  var rl=rms.filter(function(x){return x.adv===c;}),rm=reimSum(rl);
  var ci=carryIn(pid,c),co=carryOut(pid,c);
  return {c:c,cnt:nUnits(mine),
   pay:mine.reduce(function(a,l){return a+amt(l,'pay');},0),
   fee:fee,
   adm:mine.reduce(function(a,l){return a+amt(l,'admin');},0),
   adminGet:adminGet,reimList:rl,reim:rm,
   cinList:ci,cin:reimSum(ci),coutList:co,cout:reimSum(co),
   due:fee+adminGet+rm+reimSum(ci)};
 });
 o.dueCoach=o.byCoach.reduce(function(a,c){return a+c.due;},0);
 o.cin=o.byCoach.reduce(function(a,c){return a+c.cin;},0);
 o.cout=o.byCoach.reduce(function(a,c){return a+c.cout;},0);
 o.gearCinList=gearCarryIn(pid);o.gearCoutList=gearCarryOut(pid);
 o.gearCin=reimSum(o.gearCinList);o.gearCout=reimSum(o.gearCoutList);
 o.gearDue=o.gear+o.gearCin;o.cout+=o.gearCout;
 return o;
}
/* 行政費統一撥給誰 */
var ADMIN_TO='陳建廷';
var GEAR_TO='風哥';
/* EXP() 裡 sys==='payout' 的是「匯款確認」，不是一般收支，兩者要分開算 */
function payouts(){return EXP().filter(function(x){return x.sys==='payout';});}
function bills(){return EXP().filter(function(x){return x.sys!=='payout'&&x.sys!=='refund'&&x.sys!=='carry';});}
/* 補發：某期已匯但金額不足（例如事後補登課程），差額併到下一期薪資一起匯。
   sys='carry'，spid＝原本那期，pid＝併入哪一期，target＝教練。不是新支出，也不動現金，只搬應付金額 */
function carries(){return EXP().filter(function(x){return x.sys==='carry';});}
function carryIn(pid,c){return carries().filter(function(x){return x.pkind!=='gear'&&x.pid===pid&&(!c||x.target===c);});}
function gearCarryIn(pid){return carries().filter(function(x){return x.pkind==='gear'&&x.pid===pid;});}
function gearCarryOut(pid){return carries().filter(function(x){return x.pkind==='gear'&&x.spid===pid;});}
function carryOut(pid,c){return carries().filter(function(x){return x.pkind!=='gear'&&x.spid===pid&&(!c||x.target===c);});}
function refunds(){return EXP().filter(function(x){return x.sys==='refund';});}
function refundsOfPer(pid){return refunds().filter(function(x){return x.date&&pidOf(x.date)===pid;});}
function refundSess(name){
 return refunds().reduce(function(a,x){return a+(x.student===name?(+x.sessions||0):0);},0);}
function refundAmt(name){
 return refunds().reduce(function(a,x){return a+(x.student===name?(+x.amount||0):0);},0);}
function payoutOf(pid,kind,target){
 return payouts().filter(function(x){
  return x.pid===pid&&x.pkind===kind&&x.target===target;})[0]||null;
}
function payoutsOfPer(pid){return payouts().filter(function(x){return x.pid===pid;});}
/* 教練代墊：支出紀錄的 adv＝先墊錢的教練，rpid＝併入哪一期薪資一起還 */
function reimsOfPer(pid,coach){
 return bills().filter(function(x){
  return x.kind==='支出'&&x.adv&&x.rpid===pid&&(!coach||x.adv===coach);})
  .sort(function(a,b){return (a.date||'')<(b.date||'')?-1:1;});}
function reimSum(list){return list.reduce(function(a,x){return a+(+x.amount||0);},0);}
/* 跨期調整：正數是「補發」（上期少匯），負數是「扣回」（上期多匯） */
function cinText(x){return (+x.amount<0?'扣回 '+pidShort(x.spid)+' 多匯 '+money(-x.amount):'補發 '+pidShort(x.spid)+' 少匯 '+money(x.amount));}
function coutText(x){return (+x.amount<0?'多匯 '+money(-x.amount)+'，在 '+pidShort(x.pid)+' 扣回':'差額 '+money(x.amount)+' 已併入 '+pidShort(x.pid)+' 一起補發');}
/* 預設併入：採購日那一期；那一期已經發過薪或已匯給這位教練，就往後一期 */
function reimDefault(ds,coach){
 var p=pidOf(ds||today());
 if(pidPay(p)<today())p=pidOf(today());
 for(var i=0;i<24&&coach&&payoutOf(p,'coach',coach);i++)p=pidNext(p);
 return p;}
function reimDone(x){return !!(x.adv&&x.rpid&&payoutOf(x.rpid,'coach',x.adv));}
/* 現金結餘：實際收到的錢 − 實際付出去的錢 */
function cashStat(){
 var inc=PAY().reduce(function(a,x){return a+(+x.due||0);},0)
  +bills().reduce(function(a,x){return a+(x.kind==='收入'?(+x.amount||0):0);},0);
 var ref=refunds().reduce(function(a,x){return a+(+x.amount||0);},0);
 var out=payouts().reduce(function(a,x){return a+(+x.amount||0);},0)
  +bills().reduce(function(a,x){return a+(x.kind==='支出'&&!x.adv?(+x.amount||0):0);},0)+ref;
 return {inc:inc,out:out,ref:ref,bal:inc-out};
}
var EXPCAT=['器材採購','教具耗材','場地費','站場教練費','行政雜支','其他支出'];
var INCCAT=['贊助收入','其他收入'];
function expOfPer(pid){
 return bills().filter(function(x){return x.date&&pidOf(x.date)===pid;})
  .sort(function(a,b){return (a.date||'')<(b.date||'')?-1:1;});
}
function expSum(list,kind){
 return list.reduce(function(a,x){return a+(x.kind===kind?(+x.amount||0):0);},0);
}
function activePeriods(){
 var set={};
 LES().forEach(function(l){if(l.status!=='取消'&&l.date)set[pidOf(l.date)]=1;});
 PAY().forEach(function(p){if(p.date)set[pidOf(p.date)]=1;});
 bills().forEach(function(x){if(x.date)set[pidOf(x.date)]=1;});
 payouts().forEach(function(x){if(x.pid)set[x.pid]=1;});
 bills().forEach(function(x){if(x.adv&&x.rpid)set[x.rpid]=1;});
 carries().forEach(function(x){if(x.pid)set[x.pid]=1;});
 return Object.keys(set).sort();
}
/* 下拉選單用：有資料的期別，加上本期與前後各一期 */
function periodOptions(){
 var s={},cur=pidOf(today());
 activePeriods().forEach(function(x){s[x]=1;});
 [pidPrev(cur),cur,pidNext(cur)].forEach(function(x){s[x]=1;});
 return Object.keys(s).sort();
}

   var u=0;for(var i=0;i<seg.length;i++)u+=seg.charCodeAt(i)>255?2.1:1.05;
   return a+Math.max(1,Math.ceil(u*k/(w-1)));},0);};
 var put=function(row,col,v,o){

/* 算出要怎麼放（先不寫入） */
function impPlan(D){
 var P={lesson:[],old:[],noStu:{},skip:0,level:0,kb:D.kb||[]},used={};
 D.recs.forEach(function(r){
  var s=stuByName(r.name);
  if(!s){(P.noStu[r.name]=P.noStu[r.name]||[]).push(r);return;}
  var coach=impCoach(r.coach);
  /* 同一天上兩堂（例如第一堂、第二堂）要分到不同的課，依開始時間排 */
  var cand=LES().filter(function(l){return l.date===r.date&&l.status!=='取消'&&(l.students||[]).indexOf(r.name)>=0&&!used[l.id+'|'+r.name];})
   .sort(function(a,b){return a.start<b.start?-1:1;});
  var l=cand.filter(function(x){return x.coach===coach;})[0]||cand[0];
  if(l)used[l.id+'|'+r.name]=1;
  if(l){var ex=l.rec&&l.rec.stu&&l.rec.stu[r.name];
   if(ex&&!ex.imp){P.skip++;return;}
   P.lesson.push({l:l,r:r,coach:coach});}
  else P.old.push({s:s,r:r,coach:coach});
 });
 return P;
}
function impStu(r){
 var parts=(r.part||'').replace(/判斷、感知|判斷感知|判斷與感知/g,'判斷與感知').split(/[、,，\s]+/).map(function(x){x=x.trim();return IMP_PART[x]||x;}).filter(Boolean);
 return {issue:r.issue,parts:parts,fix:r.fix,cue:'',fb:r.fb,cmt:r.cmt,score:r.score,hw:r.hw,freq:r.freq,next:r.next,nth:r.nth,level:r.level,menu:'',imp:1};
}
function impApply(P){
 var touchedL={},touchedS={},n=0;
 P.lesson.forEach(function(o){
  var l=o.l,r=o.r,tp=impTopics(r.cat);
  if(!l.rec||l.rec.imp){
   if(!l.rec||!touchedL[l.id]){
    var keep=(l.rec&&l.rec.stu)||{};
    l.rec={topic:tp.topic,topicx:[tp.rest,r.topic].filter(Boolean).join('　'),menu:r.menu,gear:[],gearx:r.gear,by:o.coach,at:Date.now(),imp:1,stu:keep};}
  }
  var x=impStu(r);
  if(l.rec.menu&&r.menu&&r.menu!==l.rec.menu)x.menu=r.menu;
  l.rec.stu=l.rec.stu||{};l.rec.stu[r.name]=x;
  touchedL[l.id]=l;n++;
  /* 之前因為日期對不到存成舊紀錄的，現在對到課了就拿掉 */
  var s0=stuByName(r.name);
  if(s0&&s0.oldRecs){var b4=s0.oldRecs.length;
   hide(s0,'oldRecs',s0.oldRecs.slice());
   s0.oldRecs=s0.oldRecs.filter(function(q){var y=(q.rec&&q.rec.stu&&q.rec.stu[r.name])||{};return !(q.coach===o.coach&&y.nth===r.nth);});
   if(s0.oldRecs.length!==b4)touchedS[s0.id]=s0;}});
 P.old.forEach(function(o){
  var s=o.s,r=o.r,tp=impTopics(r.cat);
  hide(s,'oldRecs',(s.oldRecs||[]).slice());
  s.oldRecs=(s.oldRecs||[]).filter(function(q){var y=(q.rec&&q.rec.stu&&q.rec.stu[s.name])||{};return !(q.date===r.date&&q.coach===o.coach&&y.nth===r.nth);});
  var st={};st[s.name]=impStu(r);
  s.oldRecs.push({date:r.date,coach:o.coach,rec:{topic:tp.topic,topicx:[tp.rest,r.topic].filter(Boolean).join('　'),menu:r.menu,gear:[],gearx:r.gear,by:o.coach,imp:1,stu:st}});
  touchedS[s.id]=s;n++;});
 /* 層級組別補進基本資料 */
 P.lesson.concat(P.old).forEach(function(o){var s=o.s||stuByName(o.r.name);
  if(s&&o.r.level&&!(s.profile&&s.profile.level)){hide(s,'profile',Object.assign({},s.profile||{},{level:o.r.level}));touchedS[s.id]=s;}});
 if(P.kb.length){DB.cfg.kb=P.kb;touchCfg();}
 Object.keys(touchedL).forEach(function(id){var lx=touchedL[id];setRec(lx,lx.rec);});
 Object.keys(touchedS).forEach(function(id){var sx=touchedS[id];setOld(sx,sx.oldRecs);if(sx.profile)setProf(sx,sx.profile);});
 persist();
 return n;
}

 dl('學員名冊.csv',h+STU().map(function(s){
  var bs=buysOf(s.name);
  var due=bs.reduce(function(a,p){return a+(+p.due||0);},0);
  return [s.name,s.parent,s.phone,s.ganghu,s.coach,boughtOf(s.name),doneCount(s.name),leftOf(s.name),
   due,due,0,s.note].join(',');}).join('\n'));
}
function csvL(){
 var h='日期,期別,教練,方案代碼,學員姓名,人數,家長付費,公積金提撥,器材使用費,教練實收,行政費,狀態,場地,備註\n';
 dl('上課明細.csv',h+LES().map(function(l){var r=rate(l.plan)||{};
  return [l.date,period(l.date),l.coach,l.plan,'"'+l.students.join('、')+'"',l.students.length,
   r.pay||0,r.fund||0,r.gear||0,r.coach||0,adminFee(l),l.status,l.venue,l.note].join(',');}).join('\n'));
}
function csvP(){
 var h='繳費日期,學員姓名,購買方案,堂數,應收金額,已收金額,未收金額,繳費方式,備註\n';
 dl('報名收款.csv',h+PAY().map(function(p){
  return [p.date,p.student,p.plan,p.sessions||0,p.due,p.due,0,p.method,p.note].join(',');}).join('\n'));
}

function csvB(){
 var h='期別,教練,堂數,家長付費,公積金提撥,器材使用費,應匯教練,產生行政費\n';
 var map={};
 LES().forEach(function(l){
  if(l.status==='取消')return;
  var k=period(l.date)+'|'+l.coach;
  var o=map[k]||(map[k]={p:period(l.date),c:l.coach,n:0,pay:0,fund:0,gear:0,coach:0,adm:0});
  o.n++;o.pay+=amt(l,'pay');o.fund+=amt(l,'fund');o.gear+=amt(l,'gear');
  o.coach+=amt(l,'coach');o.adm+=amt(l,'admin');});
 dl('雙週結算.csv',h+Object.keys(map).sort().map(function(k){var o=map[k];
  return [o.p,o.c,o.n,o.pay,o.fund,o.gear,o.coach,o.adm].join(',');}).join('\n'));
}

   if(a==='saveBuy'){
    var who=b.dataset.nm;
    if(!val('b_plan')&&!+val('b_n'))return alert('請選方案或填堂數');
    var o2=readBuy(who);
    if(id){var pe=byId(DB.payments,id);if(pe){Object.assign(pe,o2);touch('payments',pe);}}
    else{o2.id=uid();o2.del=0;DB.payments.push(o2);touch('payments',o2);}

   if(a==='delBuy'){

   if(a==='saveLes'||a==='saveAfter'){
    var ss=readNames();

     if(!STU().some(function(s){return s.name===nm;})){

    var o3={date:val('f_date'),start:val('f_start'),end:val('f_end'),coach:val('f_coach'),

    if(a==='saveAfter'){
     var base=byId(DB.lessons,id);
     if(!base)return;
     var aff=LES().filter(function(l){return l.rid&&l.rid===base.rid&&l.date>=base.date;});
     if(!confirm('這堂以後的 '+aff.length+' 堂課會一起改成新的設定，日期各自保留。確定？'))return;
     aff.forEach(function(l){var d=l.date;Object.assign(l,o3);l.students=o3.students.slice();
      l.date=(l.id===id?o3.date:d);touch('lessons',l);});
     persist();closeSheet();render();return;}
    if(id){var le=byId(DB.lessons,id);
     if(le){
      /* 和學員頁改期用同一套檢查：同學員同時段不可重複、教練撞堂先問 */
      var dupE=LES().some(function(x){
       return x.id!==id&&x.status!=='取消'&&x.date===o3.date&&x.start===o3.start
        &&(x.students||[]).some(function(n){return ss.indexOf(n)>=0;});});
      if(dupE)return alert('這個時段已經有同一位學員的課了，請換時間或日期。');
      var busyE=LES().some(function(x){
       return x.id!==id&&x.status!=='取消'&&x.coach===o3.coach
        &&x.date===o3.date&&x.start===o3.start;});
      if(busyE&&!confirm(o3.coach+'教練在 '+o3.date.replace(/-/g,'/')+' '+o3.start
        +' 已經有其他課程，還是要這樣排嗎？'))return;
      var offE=offHours(o3.coach,[{d:o3.date,s:o3.start,e:o3.end}]);
      if(offE&&!confirm(offE))return;
      Object.assign(le,o3);le.students=o3.students.slice();
      fixGroupPlan(le);touch('lessons',le);}
     persist();closeSheet();render();return;}
    var dts=CALSEL.slice();
    if(!dts.length)return alert('請在行事曆上點出上課日期');
    if(dts.length>1&&!confirm('一次建立 '+dts.length+' 堂課\n'
      +dts[0]+' ～ '+dts[dts.length-1]+'\n\n確定建立？'))return;
    var rid=dts.length>1?uid():'';
    dts.forEach(function(d){
     var nn={};for(var k in o3)nn[k]=o3[k];
     nn.students=o3.students.slice();nn.date=d;nn.id=uid();nn.del=0;if(rid)nn.rid=rid;
     DB.lessons.push(nn);touch('lessons',nn);});
    persist();closeSheet();render();
    if(dts.length>1)alert('已建立 '+dts.length+' 堂課');
    return;}

   if(a==='delLes'){var ld=byId(DB.lessons,id);
    if(ld&&confirm('刪除這堂課？')){ld.del=1;touch('lessons',ld);persist();closeSheet();render();}return;}
   if(a==='delSeries'){
    var b2=byId(DB.lessons,id);if(!b2||!b2.rid)return;
    var cnt=seriesOf(b2.rid).length;
    if(confirm('刪除整組重複課程共 '+cnt+' 堂？無法復原。')){
     LES().forEach(function(l){if(l.rid===b2.rid){l.del=1;touch('lessons',l);}});
     persist();closeSheet();render();}
    return;}
   if(a==='undoDone'){
    var lu=byId(DB.lessons,id),nmU=b.dataset.nm;if(!lu)return;
    var pastU=lu.date<today();
    lu.status=pastU?'請假改期':'已排定';
    touch('lessons',lu);persist();closeSheet();render();
    if(pastU)fMove(lu.id,nmU);
    else{var su=STU().filter(function(x){return x.name===nmU;})[0];if(su)fStu(su.id);}
    return;}
   if(a==='undoFuture'){
    var nmF=b.dataset.nm,tF=today();
    var lf=lessonsOf(nmF).filter(function(l){return l.status==='已完成'&&l.date>=tF;});
    if(!lf.length)return;
    if(!confirm('把 '+nmF+' 這 '+lf.length+' 堂日期還沒到的課改回「已排定」？'))return;
    lf.forEach(function(l){l.status='已排定';touch('lessons',l);});
    persist();closeSheet();render();
    var sf=STU().filter(function(x){return x.name===nmF;})[0];if(sf)fStu(sf.id);
    alert('已改回 '+lf.length+' 堂。');
    return;}
   if(a==='doneStu'){var ls2=byId(DB.lessons,id);
    if(ls2&&ls2.date>today()&&!confirm('這堂是 '+ls2.date.replace(/-/g,'/')
      +'，日期還沒到。\n確定已經上完了嗎？\n\n（要順延請點這一堂改日期，不是按勾勾）'))return;
    if(ls2){ls2.status='已完成';touch('lessons',ls2);persist();closeSheet();render();
     var sd=STU().filter(function(x){return x.name===b.dataset.nm;})[0];if(sd)fStu(sd.id);}
    return;}
   if(a==='lesDly'){
    var ld=byId(DB.lessons,id);if(!ld)return;
    var st2=+b.dataset.s||7,nd=addD(ld.date,st2);
    if(!confirm('把這堂從 '+ld.date.replace(/-/g,'/')+' 延到 '+nd.replace(/-/g,'/')+' 嗎？'
      +((ld.students||[]).length>1?'\n同班 '+ld.students.length+' 位學員都會一起延。':'')))return;
    ld.date=nd;
    if(ld.status==='請假改期'&&nd>=today())ld.status='已排定';
    touch('lessons',ld);persist();closeSheet();render();return;}
   if(a==='done'){var lt=byId(DB.lessons,id);
    if(lt&&lt.status!=='已完成'&&lt.date>today()&&!confirm('這堂是 '+lt.date.replace(/-/g,'/')
      +'，日期還沒到。\n確定已經上完了嗎？'))return;
    if(lt){lt.status=(lt.status==='已完成'?(lt.date<today()?'請假改期':'已排定'):'已完成');
     touch('lessons',lt);persist();render();}
    return;}

   if(a==='csvS')return csvS();
   if(a==='csvL')return csvL();
   if(a==='csvP')return csvP();
   if(a==='csvB')return csvB();
   if(a==='repP'){var pn=setP;
    if(!lesOfPer(pn).length&&!payOfPer(pn).length&&!expOfPer(pn).length)
     return alert(pidLabel(pn)+'沒有任何課程、收款或收支紀錄，換一期試試。');
    b.textContent='產生中…';b.disabled=true;
    setTimeout(function(){repPeriod(pn);
     setTimeout(function(){render();},1200);},50);
    return;}
   if(a==='repA'){b.textContent='產生中…';b.disabled=true;
    setTimeout(function(){repAll();
     setTimeout(function(){render();},1500);},50);
    return;}
   if(a==='sync')return syncNow(true);
   if(a==='pushall'){if(confirm('把這支手機上的所有資料上傳到雲端？\n\n只在「主要那支手機」按一次就好。'
    +'其他裝置登入後會自動把資料拉下來，不需要再按，重複按可能產生同名的學員。'))pushAll();return;}
   if(a==='savesb'){
    var u=val('c_url').trim().replace(/\/+$/,''),ky=val('c_key').trim();
    if(u&&!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(u))
     return alert('網址看起來不對。應該長得像 https://abcdefgh.supabase.co，結尾不要有斜線或其他路徑。');
    if(u&&ky.length<20)
     return alert('金鑰看起來太短。請完整複製那一整串金鑰，不要漏字。');
    SB={url:u,key:ky};save('sb',SB);
    if(!u||!ky){SESS=null;save('sess',null);setST('off');render();upPill();
     return alert('已清除連線設定，改回只存在這支手機。');}
    render();upPill();
    alert('連線設定已儲存。接著在下面輸入帳號密碼登入。');return;}
   if(a==='login'){
    var em=val('c_em').trim(),pw=val('c_pw');
    if(!em||!pw)return alert('請輸入帳號和密碼');
    b.disabled=true;b.textContent='登入中…';
    sbLogin(em,pw).then(function(){
     render();upPill();syncNow(true);
    }).catch(function(e){
     b.disabled=false;b.textContent='登入';
     alert('登入失敗\n\n'+String(e.message||e));});
    return;}
   if(a==='logout'){
    if(!confirm('登出後這支手機就不再同步，本機資料還在。確定登出？'))return;
    sbLogout();return;}
   if(a==='bak'){var bb=new Blob([JSON.stringify(DB)],{type:'application/json'});
    var l2=document.createElement('a');l2.href=URL.createObjectURL(bb);
    l2.download='港湖特訓班備份_'+today()+'.json';l2.click();return;}
   if(a==='res'){var inp=document.createElement('input');inp.type='file';inp.accept='.json';
    inp.onchange=function(){var f=inp.files[0];if(!f)return;var rd=new FileReader();
     rd.onload=function(){try{var dd=JSON.parse(rd.result);
      if(dd.students)DB.students=dd.students;if(dd.lessons)DB.lessons=dd.lessons;
      if(dd.payments)DB.payments=dd.payments;if(dd.expenses)DB.expenses=dd.expenses;
      if(dd.cfg)DB.cfg=dd.cfg;
      COLS.forEach(function(c){if(!DB[c])DB[c]=[];
       DB[c].forEach(function(r){if(r.del===undefined)r.del=0;if(!r.ts)r.ts=0;});});
      persistOnly();render();alert('已還原備份。若要同步到雲端，請按「全部上傳」。');}
      catch(e){alert('檔案格式不對，請確認選的是本系統匯出的 JSON。');}};
     rd.readAsText(f);};inp.click();return;}
   if(a==='wipe'){if(confirm('清除這支手機上的全部資料？無法復原，建議先備份。\n注意：雲端上的資料不會被刪除。')){
    DB.students=DEFSTU.map(function(n){return {id:uid(),name:n,parent:'',phone:'',ganghu:'是',coach:'',note:'',del:0,ts:0};});
    DB.lessons=[];DB.payments=[];DB.expenses=[];
    PEND={students:{},lessons:{},payments:{},expenses:{},cfg:0};
    SINCE=0;save('since',0);persistOnly();render();}return;}

   if(a==='prevw'){calMon=addD(calMon,-7);render();return;}
   if(a==='nextw'){calMon=addD(calMon,7);render();return;}
   if(a==='thisw'){var t=new Date();t.setDate(t.getDate()-((t.getDay()+6)%7));calMon=ymd(t);render();return;}
  };
 });
 bindItems();
 document.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){lesF=b.dataset.f;render();};});
 document.querySelectorAll('[data-sf]').forEach(function(b){b.onclick=function(){stuF=b.dataset.sf;render();};});
 document.querySelectorAll('[data-seg]').forEach(function(b){b.onclick=function(){stuSeg=b.dataset.seg;render();};});
 var q=document.getElementById('q');
 if(q){
  var comp=false,tmr=null;
  var fire=function(){
   clearTimeout(tmr);
   tmr=setTimeout(function(){
    stuQ=q.value.trim();
    var box=document.getElementById('stulist');
    if(box){box.innerHTML=stuListHTML();bindItems();}
   },220);
  };
  q.oncompositionstart=function(){comp=true;};
  q.oncompositionend=function(){comp=false;fire();};
  q.oninput=function(){if(!comp)fire();};
 }
 var mon=document.getElementById('mon');
 if(mon)mon.onchange=function(){calMon=mon.value;render();};
 var per=document.getElementById('per');
 if(per)per.onchange=function(){setP=per.value;render();};
 /* 重複排課 */
 var fc=document.getElementById('f_coach');
 if(fc)fc.onchange=function(){drawCal();};
 var fs=document.getElementById('f_start');
 if(fs)fs.onchange=function(){
  /* 課程編輯頁：改開始時間時，結束時間照原本的上課長度往後推（90 分鐘的課不會被改回一小時） */
  var fe=document.getElementById('f_end');
  if(fe){var prev=fs.dataset.prev;
   if(!prev){for(var oi=0;oi<fs.options.length;oi++)if(fs.options[oi].defaultSelected)prev=fs.options[oi].value;}
   var d=t2m(fe.value)-t2m(prev||fs.value);
   if(!(d>0))d=60;
   var ne=m2t(t2m(fs.value)+d);
   if(TIMES.indexOf(ne)>=0)fe.value=ne;}
  fs.dataset.prev=fs.value;
  recalcDays();};
 ['f_dur','f_per'].forEach(function(k){
  var e=document.getElementById(k);if(e)e.onchange=recalcDays;});
 ['f_plan','f_stu'].forEach(function(k){var e=document.getElementById(k);
  if(e){e.onchange=upSplit;e.oninput=upSplit;}});
 /* 購課自動計價 */
 var gs=document.getElementById('g_seed');
 if(gs)gs.onchange=function(){fGroupEn(gs.value);};
 var gnm=document.getElementById('g_names');
 if(gnm)gnm.oninput=function(){
  var c=document.getElementById('g_cnt');if(!c)return;
  var arr=(gnm.value||'').split(/[、,，\s]+/).filter(Boolean);
  var known=STU().map(function(s){return s.name;});
  var neo=arr.filter(function(x){return known.indexOf(x)<0;});
  c.innerHTML='共 <b>'+arr.length+'</b> 位'
   +(neo.length?'　<span class="warnline">'+neo.join('、')+' 不在名單，儲存後會自動建立</span>'
     :'　都在學員名單裡');
 };
 var hf2=document.getElementById('h_from');
 if(hf2)hf2.onchange=function(){fHandover(hf2.value.replace(/（.*$/,''));};
 var xk=document.getElementById('x_kind');
 if(xk)xk.onchange=function(){
  var sel=document.getElementById('x_cat'),list=xk.value==='收入'?INCCAT:EXPCAT;
  sel.innerHTML=list.map(function(v){return '<option>'+v+'</option>';}).join('');};
 var bp=document.getElementById('b_plan');if(bp)bp.onchange=function(){upBuy(true);drawChips();};
 var bn=document.getElementById('b_n');if(bn)bn.oninput=function(){upBuyDue();drawChips();};
 var fg=document.getElementById('f_ganghu');if(fg&&document.getElementById('b_due'))fg.onchange=function(){upBuyDue();};
 if(document.getElementById('mc')){drawCal();drawChips();}
}
document.getElementById('syncp').onclick=function(){
 if(MODE==='coach'){syncNow(true);return;}
 if(!sbReady()||!authed()){TAB='set';
  document.querySelectorAll('.tabbar button').forEach(function(x){
   x.classList.toggle('on',x.dataset.t==='set');});
  render();window.scrollTo(0,document.body.scrollHeight);return;}
 syncNow(true);};
applySettings();applyCD();
if(MODE!=='coach')autoComplete();   // 有連雲端時這裡不會動作，等 syncNow 拉完資料後才標記
render();upPill();
/* 讀自己的角色：教練帳號開到行政網址就轉到教練端 */
loadMyRole().then(function(r){
 if(r&&r.role==='coach'&&MODE==='admin'){location.replace('coach.html');return;}
 if(MODE==='coach')render();});
if(sbReady()&&canSync())syncNow();
