<!DOCTYPE html>
<html lang="zh-Hant-TW"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light"><meta name="theme-color" content="#1B3240">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>港湖特訓班｜行政管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light only;
--navy:#1B3240;--navy2:#294A5C;--ink:#15242E;--ink2:#37525F;--muted:#6E8794;
--paper:#F5F3EC;--card:#fff;--line:#E4E1D6;--line2:#F0EDE4;
--or:#FE7F2D;--or-d:#A8490A;--or-s:#FFF1E3;
--yellow:#FCCA46;--sage:#A1C181;--teal:#4E8676;--teal-s:#E9F1EE;
--red:#C0392B;--red-s:#FBE9E6;--green:#2C7A52;--green-s:#E8F2EA;
--r:14px;--sh:0 1px 2px rgba(21,36,46,.05),0 4px 14px rgba(21,36,46,.05)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);
font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
font-size:15px;line-height:1.65;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.num{font-family:Oswald,"Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums;font-weight:500}
table,.st b,.tag{font-variant-numeric:tabular-nums}

/* ---------- 頁首 ---------- */
header{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;
padding:calc(11px + env(safe-area-inset-top)) 18px 11px;display:flex;align-items:center;gap:11px;
box-shadow:inset 0 -3px 0 var(--or)}
.mark{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:var(--or);
display:grid;place-items:center}
.mark svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.7}
header h1{font-size:16px;font-weight:800;letter-spacing:.02em}
header .sub{font-size:11px;opacity:.6;letter-spacing:.08em;text-transform:uppercase}
.syncp{margin-left:auto;border:0;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;
padding:5px 11px;border-radius:999px;display:flex;align-items:center;gap:6px;
background:rgba(255,255,255,.13);color:rgba(255,255,255,.8)}
.syncp i{width:7px;height:7px;border-radius:50%;background:currentColor;font-style:normal;flex:0 0 7px}
.syncp.ok{background:rgba(161,193,129,.22);color:#C6E0AE}
.syncp.ing{background:rgba(252,202,70,.2);color:var(--yellow)}
.syncp.pend{background:rgba(254,127,45,.22);color:#FFC08A}
.syncp.err{background:rgba(192,57,43,.3);color:#FFB3A8}
.syncp.ing i{animation:bl .9s ease-in-out infinite}
@keyframes bl{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.syncp.ing i{animation:none}}
.ico{background:#F2F0E8;border:1px solid var(--line);border-radius:9px;width:38px;height:38px;
cursor:pointer;display:grid;place-items:center;padding:0;flex:0 0 38px}
.ico svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ico.on{background:var(--green-s);border-color:#BBDCC4}
.ico.on svg{stroke:var(--green)}
.tel{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--teal);text-decoration:none}

.wrap{max-width:920px;margin:0 auto;padding:16px 15px 8px}

/* ---------- 底部分頁 ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);
backdrop-filter:saturate(1.6) blur(12px);border-top:1px solid var(--line);
display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;background:none;border:0;font-size:11px;color:var(--muted);font-weight:700;
display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;cursor:pointer;
font-family:inherit;border-radius:11px;transition:color .15s,background .15s}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;
stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--or-d);background:var(--or-s)}

/* ---------- 記分板（總覽主視覺） ---------- */
.board{background:var(--navy);border-radius:var(--r);padding:15px 16px 14px;color:#fff;
box-shadow:var(--sh);position:relative;overflow:hidden}
.board::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
background:linear-gradient(90deg,var(--or) 0 34%,var(--yellow) 34% 67%,var(--sage) 67% 100%)}
.board .cap{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.board .cap b{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;font-weight:600}
.board .cap span{font-size:12px;opacity:.75;margin-left:auto}
.bg3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:rgba(255,255,255,.12);
border-radius:10px;overflow:hidden}
.bg3 div{background:var(--navy2);padding:11px 8px;text-align:center}
.bg3 small{display:block;font-size:11px;opacity:.7;margin-bottom:2px}
.bg3 b{font-size:21px;font-weight:600;letter-spacing:-.01em}
.bg3 .hi{color:var(--yellow)}

/* ---------- 卡片 / 區塊 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
padding:15px;margin-bottom:12px;box-shadow:var(--sh)}
h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin-bottom:3px}
.hint{font-size:13px;color:var(--muted);margin-bottom:14px}
.sec-t{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;color:var(--muted);
margin:20px 0 8px;letter-spacing:.1em}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* ---------- 表單 ---------- */
label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:13px 0 5px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
font-size:16px;font-family:inherit;background:#fff;color:var(--ink);appearance:none}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236E8794' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>");
background-repeat:no-repeat;background-position:right 13px center;padding-right:34px}
select[multiple]{background-image:none;padding-right:12px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--or);box-shadow:0 0 0 3px var(--or-s)}
button.btn{background:var(--or);color:#fff;border:0;border-radius:999px;padding:12px 22px;
font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
box-shadow:0 2px 8px rgba(254,127,45,.28)}
button.btn:active{transform:translateY(1px)}
button.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
button.btn.nav{background:var(--navy);color:#fff;box-shadow:none}
button.btn.dan{background:var(--red);box-shadow:none}
button.btn.sm{padding:8px 15px;font-size:13px}
button.btn.full{width:100%;display:flex;align-items:center;justify-content:center;gap:7px}
button.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ---------- 統計小卡 ---------- */
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
box-shadow:var(--sh);position:relative;padding-left:16px}
.st::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:4px;
border-radius:0 4px 4px 0;background:var(--teal)}
.st small{display:block;font-size:12px;color:var(--muted)}
.st b{font-size:20px;font-weight:600;font-family:Oswald,"Noto Sans TC",sans-serif}
.st.or::before{background:var(--or)}.st.red::before{background:var(--red)}
.st.sage::before{background:var(--sage)}.st.yl::before{background:var(--yellow)}

/* ---------- 列表項目 ---------- */
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
margin-bottom:9px;box-shadow:var(--sh);cursor:pointer;transition:border-color .15s}
.item:active{border-color:var(--or)}
.item .top{display:flex;align-items:flex-start;gap:10px}
.item .nm{font-weight:800;font-size:16px;line-height:1.4}
.item .meta{font-size:13px;color:var(--muted);margin-top:2px}
.item .acts{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.item.warn{border-left:4px solid var(--red)}
.item.pl{border-left:4px solid var(--teal)}

.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;
background:var(--or-s);color:var(--or-d);white-space:nowrap}
.tag.g{background:var(--green-s);color:var(--green)}
.tag.r{background:var(--red-s);color:var(--red)}
.tag.b{background:#E8EFF3;color:#2F5D77}
.tag.t{background:var(--teal-s);color:var(--teal)}
.warnline{color:var(--red);font-weight:700}
.mini{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.7}

/* ---------- 彈出表單 ---------- */
.modal{position:fixed;inset:0;background:rgba(21,36,46,.5);z-index:100;display:none;
align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:920px;max-height:93vh;overflow-y:auto;
border-radius:20px 20px 0 0;padding:8px 16px calc(30px + env(safe-area-inset-bottom));
animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.grip{width:38px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 6px}
.sheet .close{position:sticky;top:0;display:flex;align-items:center;gap:8px;background:var(--paper);
padding:6px 0 10px;z-index:2}
.sheet h3{font-size:18px;font-weight:800}
.sheet .close button{margin-left:auto}
.fbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:2px 13px 14px;margin-top:10px}
.fbox>.ttl{font-size:12px;font-weight:800;color:var(--or-d);letter-spacing:.06em;
margin:13px 0 0;padding-top:2px}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line2);padding:9px 4px;text-align:center}
th{background:#F3F1E9;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
.tt{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tt table{min-width:760px}
.tt td{vertical-align:top;padding:5px 3px}
.tt th:first-child,.tt td:first-child{position:sticky;left:0;background:#F3F1E9;z-index:1}
.slot{background:var(--teal);color:#fff;border-radius:8px;padding:6px 5px;font-size:11px;
font-weight:700;margin-bottom:4px;line-height:1.4}
.slot.grp{background:var(--or)}
.slot small{display:block;font-weight:400;opacity:.92;font-size:10px}

.empty{text-align:center;color:var(--muted);padding:30px 16px;font-size:14px;
background:var(--card);border:1px dashed var(--line);border-radius:12px}
.warnbar{background:var(--or-s);border:1px solid #FFD4AC;border-radius:12px;padding:11px 13px;
font-size:13px;color:var(--or-d);margin-bottom:12px;font-weight:600}
.filt{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.filt button{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;
padding:7px 15px;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
.filt button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- 重複排課 ---------- */
.dows{display:flex;gap:5px}
.dows button{flex:1;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 0;
font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
.dows button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.repbox{background:#FBFAF4;border:1px solid var(--line);border-radius:12px;padding:2px 13px 14px;margin-top:10px}
.prev{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-top:11px;
font-size:12px;color:var(--ink2);line-height:1.75;max-height:140px;overflow-y:auto}
.prev b{color:var(--or-d)}
.split{background:var(--or-s);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:12px;
color:var(--or-d);line-height:1.75}
.buy{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-top:9px;background:#fff;
cursor:pointer;display:flex;align-items:flex-start;gap:10px}
/* 迷你行事曆 */
.mc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 10px 12px;margin-top:8px}
.mc-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mc-h b{flex:1;text-align:center;font-size:15px;font-weight:800}
.mc-h button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;
font-size:16px;color:var(--ink2);cursor:pointer;font-family:inherit;line-height:1}
.mc-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mc-g span{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:3px 0}
.mc-g button{aspect-ratio:1;border:1px solid transparent;border-radius:9px;background:#fff;
font-size:15px;font-family:Oswald,inherit;font-weight:500;color:var(--ink);cursor:pointer;padding:0}
.mc-g button.o{color:#C9C6BC}
.mc-g button.t{border-color:var(--or);color:var(--or-d);font-weight:600}
.mc-g button.on{background:var(--or);color:#fff;border-color:var(--or)}
.mc-g button.busy{background:#F3F1E9;color:var(--muted)}
.mc-g button i{font-style:normal;font-size:10px;vertical-align:super;margin-left:1px;opacity:.9}
.mc-g button.on.busy{background:var(--or);color:#fff}
.mc-g button:disabled{opacity:.25;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{background:var(--teal-s);color:var(--teal);border:1px solid #CFE3DC;border-radius:999px;
padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.chips button::after{content:" ✕";opacity:.55}
.cnt{display:flex;align-items:baseline;gap:8px;margin-top:12px;font-size:13px;color:var(--ink2)}
.cnt b{font-family:Oswald,inherit;font-size:22px;font-weight:600;color:var(--or-d)}
.cnt.ok b{color:var(--green)}
.poster{width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin-top:10px}
.seg{display:flex;background:#EDEAE0;border-radius:11px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 0;font-size:14px;
font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:var(--or-d);box-shadow:0 1px 3px rgba(21,36,46,.12)}
.buy .l{font-weight:700;font-size:14px}
.buy .m{font-size:12px;color:var(--muted);margin-top:2px}
.buy .rr{margin-left:auto;text-align:right;flex:0 0 auto}
</style></head><body>

<header>
  <span class="mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M6 5.5c2 3.5 2 9.5 0 13M18 5.5c-2 3.5-2 9.5 0 13"/></svg></span>
  <h1>港湖特訓班</h1>
  <button class="syncp" id="syncp" title="點一下立即同步"><i></i><span>未連線</span></button>
</header>
<div class="wrap" id="app"></div>

<div class="tabbar" id="tabs"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ============ 圖示 ============ */
var IC={

stu:'<circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c.6-4 3.7-6 7.5-6s6.9 2 7.5 6"/>',

set:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><circle cx="12" cy="12.5" r="2.6"/><path d="M3 10h2M19 15h2"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
edit:'<path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"/>',
cash:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><circle cx="12" cy="12.5" r="2.6"/>',
warn:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.1"/>',
check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
cloud:'<path d="M7 18h10a3.6 3.6 0 0 0 .3-7.2A5.5 5.5 0 0 0 6.6 10 3.9 3.9 0 0 0 7 18z"/>'
};
function svg(k,sz){return '<svg viewBox="0 0 24 24"'+(sz?' style="width:'+sz+'px;height:'+sz+'px"':'')+'>'+IC[k]+'</svg>';}

/* ============ 儲存 ============ */
var MEM={},HASLS=true;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){HASLS=false;}
function save(k,v){var s=JSON.stringify(v);if(HASLS){try{localStorage.setItem('gh_'+k,s);}catch(e){MEM[k]=s;}}else{MEM[k]=s;}}
function load(k,d){var s=HASLS?localStorage.getItem('gh_'+k):MEM[k];if(!s)return d;try{return JSON.parse(s);}catch(e){return d;}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* 本地日期工具（不用 toISOString，避免 UTC+8 早上 8 點前日期少一天） */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return ymd(new Date());}
function pd(ds){var a=(ds||'').split('-');return new Date(+a[0],(+a[1]||1)-1,+a[2]||1);}
function addD(ds,n){var d=pd(ds);d.setDate(d.getDate()+n);return ymd(d);}
function dowOf(ds){return pd(ds).getDay();}

/* ============ 預設資料 ============ */
var COACHES=['陳建廷','陳凱文','謝長霖','陳毅祥','鄭原成','盧瑞祥','彭威寰'];

/* 上課費率：家長付費＝公積金＋器材＋教練實收；行政費自公積金撥出 */

 {code:'一對一-專業-單堂',pay:1300,fund:200,gear:50,coach:1050},
 {code:'一對一-專業-套餐',pay:1200,fund:100,gear:50,coach:1050},
 {code:'一對一-菁英-單堂',pay:1400,fund:200,gear:50,coach:1150},
 {code:'一對一-菁英-套餐',pay:1300,fund:100,gear:50,coach:1150},
 {code:'一對一-資深-單堂',pay:1500,fund:300,gear:50,coach:1150},
 {code:'一對一-資深-套餐',pay:1400,fund:200,gear:50,coach:1150},
 {code:'一對二',pay:1700,fund:200,gear:50,coach:1450},
 {code:'團班4人',pay:1800,fund:200,gear:50,coach:1550},
 {code:'團班5人',pay:2250,fund:300,gear:100,coach:1850},

/* ---- 行政費（115.08.16 第四次會議決議）----
   1對1 50／1對2 75／團班 4人100、5人125、6人150，自公積金提撥。
   依該堂實際登記人數計算；沒填學員時退回用方案代碼推算。 */
var ADMINTB={1:50,2:75,3:100,4:100,5:125,6:150};
function planHead(p){
 p=p||'';
 if(p.indexOf('團班')===0){var m=p.match(/(\d+)/);return m?+m[1]:4;}
 if(p.indexOf('一對二')===0)return 2;
 return 1;
}
function headOf(l){
 var n=(l.students||[]).length;
 if(!n)n=planHead(l.plan);
 if(n<1)n=1;if(n>6)n=6;
 return n;
}
function adminFee(l){return ADMINTB[headOf(l)]||50;}
function amt(l,k){if(k==='admin')return adminFee(l);var r=rate(l.plan);return r?(+r[k]||0):0;}
function headMismatch(l){var n=(l.students||[]).length;return n>0&&n!==planHead(l.plan);}
function clash(l){
 if(l.status==='取消')return false;
 return LES().some(function(x){
  return x.id!==l.id&&x.status!=='取消'&&x.coach===l.coach&&x.date===l.date&&x.start===l.start;});
}

function boughtOf(name){return buysOf(name).reduce(function(a,p){return a+(+p.sessions||0);},0);}
function doneCount(name){var c=0;LES().forEach(function(l){if(l.status==='已完成'&&l.students.indexOf(name)>=0)c++;});return c;}
function leftOf(name){return boughtOf(name)-doneCount(name);}
function paidOf(name){return buysOf(name).reduce(function(a,p){return a+(+p.due||0);},0);}

function seriesOf(rid){return rid?LES().filter(function(l){return l.rid===rid;}):[];}
/* 團班人數變動後，方案代碼跟著調整 */
function fixGroupPlan(l){
 if(l.plan.indexOf('團班')===0){
  var n=Math.max(4,Math.min(6,l.students.length));
  l.plan='團班'+n+'人';
 }
}
/* 把某位學員的某一堂課改到新的日期時段
   solo=true 只搬這位學員（原班其他人不動）；false 整堂一起搬 */
function moveLesson(l,name,d,s,e,solo,coach){
 coach=coach||l.coach;
 if(!solo||(l.students||[]).length<=1){
  l.date=d;l.start=s;l.end=e;l.coach=coach;touch('lessons',l);return l;
 }
 l.students=l.students.filter(function(x){return x!==name;});
 fixGroupPlan(l);touch('lessons',l);
 return joinOrCreate({date:d,start:s,end:e,coach:coach,plan:l.plan,
   venue:l.venue,status:'已排定',note:l.note||''},name);
}
/* 團班／一對二：同教練同時段已有課就把學員併進去，並依人數調整方案 */
function joinOrCreate(o,name){
 var hit=LES().filter(function(l){
  return l.status!=='取消'&&l.coach===o.coach&&l.date===o.date&&l.start===o.start;})[0];
 if(hit){
  if(name&&hit.students.indexOf(name)<0)hit.students.push(name);
  if(hit.plan.indexOf('團班')===0){
   var n=Math.max(4,Math.min(6,hit.students.length));
   hit.plan='團班'+n+'人';
  }
  touch('lessons',hit);
  return hit;
 }
 var nn={};for(var k in o)nn[k]=o[k];
 nn.students=name?[name]:[];nn.id=uid();nn.del=0;
 DB.lessons.push(nn);touch('lessons',nn);
 return nn;
}

 else if(!authed()){cls='pend';tx='請登入';}

 else if(n>0){cls='pend';tx='待同步 '+n;}

 e.querySelector('span').textContent=tx;
}

/* ---- Supabase 連線 ---- */
function sbURL(path){return SB.url.replace(/\/+$/,'')+path;}
function sbErr(j,fallback){
 return (j&&(j.message||j.error_description||j.msg||j.error||j.hint))||fallback;
}
function sbRefresh(){
 return fetch(sbURL('/auth/v1/token?grant_type=refresh_token'),{
  method:'POST',headers:{'apikey':SB.key,'Content-Type':'application/json'},
  body:JSON.stringify({refresh_token:SESS.refresh_token})})
 .then(function(r){return r.json();})
 .then(function(j){
  if(!j.access_token){SESS=null;save('sess',null);throw new Error('登入已過期，請重新登入');}
  SESS={access_token:j.access_token,refresh_token:j.refresh_token,email:SESS.email};
  save('sess',SESS);});
}
function sbFetch(path,opts,retried){
 opts=opts||{};
 var h={};for(var k in (opts.headers||{}))h[k]=opts.headers[k];
 h['apikey']=SB.key;
 h['Authorization']='Bearer '+((SESS&&SESS.access_token)||SB.key);
 h['Content-Type']='application/json';
 var o={method:opts.method||'GET',headers:h};
 if(opts.body)o.body=opts.body;
 return fetch(sbURL(path),o).then(function(r){
  if(r.status===401&&!retried&&SESS&&SESS.refresh_token)
   return sbRefresh().then(function(){return sbFetch(path,opts,true);});
  return r;});
}
function sbLogin(email,pw){
 return fetch(sbURL('/auth/v1/token?grant_type=password'),{
  method:'POST',headers:{'apikey':SB.key,'Content-Type':'application/json'},
  body:JSON.stringify({email:email,password:pw})})
 .then(function(r){return r.json();})
 .then(function(j){
  if(!j.access_token)throw new Error(sbErr(j,'帳號或密碼不正確'));
  SESS={access_token:j.access_token,refresh_token:j.refresh_token,email:email};
  save('sess',SESS);});
}

/* 把一批資料寫上去（同 id 就覆蓋） */
function sbPush(table,rows){
 return sbFetch('/rest/v1/'+table,{method:'POST',
  headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
  body:JSON.stringify(rows)})
 .then(function(r){
  if(r.ok)return true;
  return r.json().catch(function(){return {};}).then(function(j){
   throw new Error('寫入 '+table+' 失敗：'+sbErr(j,'HTTP '+r.status));});});
}
function sbPull(table){
 return sbFetch('/rest/v1/'+table+'?select=id,ts,del,data&ts=gte.'+SINCE+'&order=ts.asc')
 .then(function(r){return r.json().then(function(j){
  if(!Array.isArray(j))throw new Error('讀取 '+table+' 失敗：'+sbErr(j,'HTTP '+r.status));
  return j;});});
}
function setST(s){SYNCST=s;upPill();}

function mergeIn(recs){
 ['students','lessons','payments'].forEach(function(col){
  (recs[col]||[]).forEach(function(r){
   if(PEND[col][r.id])return;               // 本機還有沒送出的改動，先不要蓋掉
   var o=r.data||{};o.id=r.id;o.ts=r.ts;o.del=r.del?1:0;
   var cur=byId(DB[col],r.id);
   if(!cur&&col==='students'&&o.name){
    // 第一次連雲端時，把同名、從未編輯過的預設名單清掉，避免整份重複
    for(var q=DB[col].length-1;q>=0;q--){var x=DB[col][q];
     if(x.id!==r.id&&x.name===o.name&&!x.ts&&!PEND[col][x.id])DB[col].splice(q,1);}
   }
   if(!cur)DB[col].push(o);
   else if(r.ts>=(cur.ts||0))DB[col][DB[col].indexOf(cur)]=o;
  });});
 (recs.cfg||[]).forEach(function(r){
  if(PEND.cfg)return;
  if(r.ts>=(DB.cfg.ts||0)){var c=r.data||{};c.ts=r.ts;DB.cfg=c;}});
}

var TB=['students','lessons','payments','cfg'];
function syncNow(manual){
 if(!sbReady()){setST('off');
  if(manual)alert('還沒設定資料庫連線。到「結算」分頁最下面填入網址和金鑰。');return;}
 if(!authed()){setST('off');
  if(manual)alert('還沒登入。到「結算」分頁最下面輸入帳號密碼登入。');return;}
 if(SYNCST==='ing')return;
 setST('ing');

 var snap={students:{},lessons:{},payments:{},cfg:PEND.cfg},jobs=[],cnt=0;
 ['students','lessons','payments'].forEach(function(col){
  var rows=[];
  Object.keys(PEND[col]).forEach(function(id){
   var r=byId(DB[col],id);
   if(!r){delete PEND[col][id];return;}
   snap[col][id]=r.ts;
   rows.push({id:r.id,del:r.del?1:0,data:r});
  });
  if(rows.length){cnt+=rows.length;jobs.push(sbPush(col,rows));}
 });
 if(PEND.cfg){cnt++;jobs.push(sbPush('cfg',[{id:'cfg',del:0,data:DB.cfg}]));}

 Promise.all(jobs)
 .then(function(){return Promise.all(TB.map(function(c){
   return sbPull(c).then(function(j){return {col:c,rows:j};});}));})
 .then(function(res){
  var recs={},maxts=SINCE;
  res.forEach(function(x){
   recs[x.col]=x.rows;
   x.rows.forEach(function(r){if(r.ts>maxts)maxts=r.ts;});});
  mergeIn(recs);
  SINCE=maxts;save('since',SINCE);
  ['students','lessons','payments'].forEach(function(col){
   Object.keys(snap[col]).forEach(function(id){
    if(PEND[col][id]===snap[col][id])delete PEND[col][id];});});
  if(snap.cfg&&PEND.cfg===snap.cfg)PEND.cfg=0;
  LASTSYNC=new Date().toTimeString().slice(0,5);save('lastsync',LASTSYNC);
  persistOnly();SYNCMSG='';setST('ok');render();
  if(manual)alert('同步完成，'+(cnt?'送出 '+cnt+' 筆變更。':'沒有新的變更。'));
 })
 .catch(function(e){
  SYNCMSG=String(e.message||e);setST('err');upPill();
  if(manual)alert('同步失敗\n\n'+SYNCMSG);
 });
}

}

function lastPlanOf(name){

 var bs=buysOf(name);

 return (s&&s.coach)||'';

/* ============ 迷你行事曆（多選上課日期）============ */
/* CALSEL 每一筆是一堂課：{d 日期, s 開始, e 結束} */
var CALSEL=[],CALM='';
function calSort(){CALSEL.sort(function(a,b){return (a.d+a.s)<(b.d+b.s)?-1:1;});}
function calInit(list){
 CALSEL=(list||[]).slice();calSort();
 CALM=((CALSEL[0]||{}).d||today()).slice(0,7);
}
function calOn(ds){return CALSEL.filter(function(x){return x.d===ds;});}
/* 一次加入「每次上課堂數」堂，時段接著排下去 */
function calPer(){return Math.max(1,Math.min(4,+val('f_per')||1));}
function calDur(){return Math.max(30,+val('f_dur')||60);}
function addDay(ds){
 var base=t2m(val('f_start')||'18:00'),dur=calDur();
 for(var k=0;k<calPer();k++){
  var s=m2t(base+k*dur),e=m2t(base+(k+1)*dur);
  if(!CALSEL.some(function(x){return x.d===ds&&x.s===s;}))CALSEL.push({d:ds,s:s,e:e});
 }
}
var CALONE=false;
function calBlock(one){
 CALONE=!!one;
 return '<div class="mc" id="mc"></div>'
 +(one?''
   :'<div class="row" style="margin-top:10px">'
    +'<button class="btn sec sm" data-act="calweek">每週同一天排滿</button>'
    +'<button class="btn sec sm" data-act="cal2week">每兩週排滿</button>'
    +'<button class="btn sec sm" data-act="calclear">清空</button></div>')
 +'<div class="chips" id="calchips"></div>'
 +'<div class="cnt" id="calcnt"></div>';
}
function drawCal(){
 var box=document.getElementById('mc');if(!box)return;
 var y=+CALM.slice(0,4),m=+CALM.slice(5,7);
 var first=new Date(y,m-1,1),lead=first.getDay();
 var last=new Date(y,m,0).getDate();
 var h='<div class="mc-h"><button type="button" data-act="calprev">‹</button>'
  +'<b>'+y+' 年 '+m+' 月</b>'
  +'<button type="button" data-act="calnext">›</button></div><div class="mc-g">'
  +DAYN.map(function(n){return '<span>'+n.slice(1)+'</span>';}).join('');
 for(var i=0;i<lead;i++)h+='<button type="button" disabled></button>';
 var co=val('f_coach'),st=val('f_start');
 for(var d=1;d<=last;d++){
  var ds=CALM+'-'+String(d).padStart(2,'0');
  var mine=calOn(ds);
  var busy=co&&LES().some(function(l){
   return l.status!=='取消'&&l.coach===co&&l.date===ds&&l.start===st;});
  h+='<button type="button" class="'+(mine.length?'on ':'')+(busy?'busy ':'')+(ds===today()?'t':'')
   +'" data-d="'+ds+'">'+d+(mine.length>1?'<i>'+mine.length+'</i>':'')+'</button>';
 }
 box.innerHTML=h+'</div>';
 box.querySelectorAll('[data-d]').forEach(function(b){
  b.onclick=function(){
   var ds=b.dataset.d;
   if(CALONE){CALSEL=[];addDay(ds);}
   else if(calOn(ds).length)CALSEL=CALSEL.filter(function(x){return x.d!==ds;});
   else addDay(ds);
   calSort();drawCal();drawChips();};});
 box.querySelector('[data-act="calprev"]').onclick=function(){
  var d=new Date(y,m-2,1);CALM=ymd(d).slice(0,7);drawCal();};
 box.querySelector('[data-act="calnext"]').onclick=function(){
  var d=new Date(y,m,1);CALM=ymd(d).slice(0,7);drawCal();};
}
function drawChips(){
 var c=document.getElementById('calchips'),n=document.getElementById('calcnt');
 if(!c)return;
 c.innerHTML=CALSEL.map(function(o,i){
  return '<button type="button" data-x="'+i+'">'+o.d.slice(5).replace('-','/')
   +'('+DAYN[dowOf(o.d)].slice(1)+') '+o.s+'</button>';}).join('');
 c.querySelectorAll('[data-x]').forEach(function(b){
  b.onclick=function(){CALSEL.splice(+b.dataset.x,1);drawCal();drawChips();};});
 if(n){
  var want=+val('b_n')||0;
  n.className='cnt'+(want&&CALSEL.length===want?' ok':'');
  if(CALONE){
   n.className='cnt'+(CALSEL.length?' ok':'');
   n.innerHTML=CALSEL.length
    ?'改到 <b>'+CALSEL[0].d.replace(/-/g,'/')+'</b>（'+DAYN[dowOf(CALSEL[0].d)]+'）'+CALSEL[0].s+'–'+CALSEL[0].e
    :'請在上面點一個新的日期';
   return;
  }
  var dd={};CALSEL.forEach(function(o){dd[o.d]=1;});
  var nd=Object.keys(dd).length,per=calPer();
  n.className='cnt'+(want&&CALSEL.length===want?' ok':'');
  n.innerHTML='已選 <b>'+CALSEL.length+'</b> 堂　'+nd+' 天'+(per>1?'，每次 '+per+' 堂':'')
   +(want?'　方案共 '+want+' 堂'+(CALSEL.length===want?'　✓ 剛好'
     :(CALSEL.length<want?'　還差 '+(want-CALSEL.length)+' 堂':'　多了 '+(CALSEL.length-want)+' 堂')):'');
 }
}
/* 改了時間／時長／每次堂數之後，把已選的那幾天用新設定重排一次 */
function recalcDays(){
 if(!document.getElementById('mc'))return;
 if(CALSEL.length){
  var dd=[];CALSEL.forEach(function(o){if(dd.indexOf(o.d)<0)dd.push(o.d);});
  CALSEL=[];dd.forEach(addDay);calSort();
 }
 drawCal();drawChips();
}
/* 以最早選的那天為起點整份重算，按幾次結果都一樣 */
function calFill(step){
 if(!CALSEL.length)return alert('請先在行事曆上點一天，當作第一次上課');
 calSort();
 var first=CALSEL[0].d,per=calPer();
 var want=+val('b_n')||CALSEL.length;
 var days=Math.max(1,Math.ceil(want/per));
 CALSEL=[];
 var cur=first;
 for(var i=0;i<days;i++){addDay(cur);cur=addD(cur,step);}
 calSort();
 if(CALSEL.length>want)CALSEL=CALSEL.slice(0,want);
 CALM=first.slice(0,7);drawCal();drawChips();
}

function makePoster(){
 var days=[];for(var i=0;i<7;i++)days.push(addD(calMon,i));
 var used=usedSlots(days);

 var W=1512,PAD=36,HEAD=196,TC=150,COLH=76;
 var CW=(W-PAD*2-TC)/7;
 var F='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';

 /* 先用一張暫時的畫布量文字，算出每一列要多高 */
 var probe=document.createElement('canvas').getContext('2d');
 function cell(t,ds){
  return LES().filter(function(l){return l.status!=='取消'&&l.date===ds&&l.start===t;});
 }
 /* 依姓名斷行，「、」不會掉到行首 */
 function wrapNames(x,arr,maxW,maxLines){
  if(!arr.length)return ['—'];
  var out=[],cur='';
  for(var i=0;i<arr.length;i++){
   var tryS=cur?cur+'、'+arr[i]:arr[i];
   if(cur&&x.measureText(tryS).width>maxW){
    out.push(cur+'、');
    if(out.length>=maxLines){out[maxLines-1]=cur+'…';return out;}
    cur=arr[i];
   }else cur=tryS;
  }
  if(cur)out.push(cur);
  return out;
 }
 function lines(x,l){
  x.font='400 21px '+F;
  return wrapNames(x,l.students||[],CW-30,l.plan.indexOf('團班')===0?4:2);
 }
 function blockH(l){return 40+lines(probe,l).length*26+12;}
 var rowH=used.map(function(t){
  var mx=0;
  days.forEach(function(ds){
   var h=0;cell(t,ds).forEach(function(l){h+=blockH(l)+6;});
   if(h>mx)mx=h;});
  return Math.max(mx+12,92);
 });
 var H=HEAD+COLH+rowH.reduce(function(a,b){return a+b;},0)+PAD+64;

 var c=document.createElement('canvas');c.width=W;c.height=H;
 var x=c.getContext('2d');
 x.fillStyle='#F5F3EC';x.fillRect(0,0,W,H);

 /* 標題列 */
 x.fillStyle='#1B3240';x.fillRect(0,0,W,HEAD-26);
 ['#FE7F2D','#FCCA46','#A1C181'].forEach(function(col,i){
  x.fillStyle=col;x.fillRect(i*W/3,HEAD-26,W/3,10);});
 x.fillStyle='#fff';x.font='700 48px '+F;
 x.fillText('港湖特訓班　本週課表',PAD,88);
 x.fillStyle='rgba(255,255,255,.72)';x.font='400 28px '+F;
 var a0=days[0],b0=days[6];
 x.fillText(a0.slice(0,4)+'/'+a0.slice(5,7)+'/'+a0.slice(8)+' – '+b0.slice(5,7)+'/'+b0.slice(8),PAD,134);

 /* 星期標頭 */
 var top=HEAD;
 days.forEach(function(ds,i){
  var cx=PAD+TC+i*CW;
  var wk=dowOf(ds);
  x.fillStyle=(wk===0||wk===6)?'#EDE9DC':'#E4E1D6';
  x.fillRect(cx,top,CW-4,COLH);
  x.fillStyle='#1B3240';x.font='700 27px '+F;
  x.textAlign='center';
  x.fillText(DAYN[wk],cx+CW/2-2,top+34);
  x.fillStyle='#6E8794';x.font='500 22px '+F;
  x.fillText((+ds.slice(5,7))+'/'+(+ds.slice(8)),cx+CW/2-2,top+62);
  x.textAlign='left';
 });

 /* 每個時段一列 */
 var y=top+COLH;
 used.forEach(function(t,ri){
  var hRow=rowH[ri];
  var end=(function(){var e='';days.forEach(function(ds){
   var h=cell(t,ds);if(h.length&&!e)e=h[0].end;});return e;})();
  x.fillStyle=ri%2?'#EFEDE6':'#F5F3EC';
  x.fillRect(PAD,y,W-PAD*2,hRow);
  /* 時段欄 */
  x.fillStyle='#1B3240';x.font='600 30px Oswald,'+F;
  x.fillText(t,PAD+16,y+40);
  x.fillStyle='#9AA9B2';x.font='400 22px Oswald,'+F;
  x.fillText(end,PAD+16,y+70);
  x.strokeStyle='#DFDCD1';x.lineWidth=2;
  x.beginPath();x.moveTo(PAD,y);x.lineTo(W-PAD,y);x.stroke();

  days.forEach(function(ds,i){
   var cx=PAD+TC+i*CW,cy=y+8;
   cell(t,ds).forEach(function(l){
    var bh=blockH(l),grp=l.plan.indexOf('團班')===0;
    x.fillStyle='#fff';rr(x,cx+2,cy,CW-10,bh,12);x.fill();
    x.fillStyle=grp?'#FE7F2D':'#4E8676';rr(x,cx+2,cy,7,bh,4);x.fill();
    x.fillStyle=grp?'#A8490A':'#15242E';x.font='700 25px '+F;
    x.fillText(l.coach,cx+20,cy+30);
    x.fillStyle='#37525F';x.font='400 21px '+F;
    lines(x,l).forEach(function(line,k){
     x.fillText(line,cx+20,cy+56+k*26);});
    cy+=bh+6;
   });
  });
  y+=hRow;
 });
 x.strokeStyle='#DFDCD1';x.lineWidth=2;
 x.beginPath();x.moveTo(PAD,y);x.lineTo(W-PAD,y);x.stroke();

 /* 圖例 */
 x.fillStyle='#4E8676';rr(x,PAD,y+26,20,20,5);x.fill();
 x.fillStyle='#6E8794';x.font='400 22px '+F;x.fillText('個別課',PAD+30,y+43);
 x.fillStyle='#FE7F2D';rr(x,PAD+130,y+26,20,20,5);x.fill();
 x.fillStyle='#6E8794';x.fillText('團班',PAD+160,y+43);
 x.fillText('課程異動請洽行政　建廷教練',W-PAD-320,y+43);
 return c;
}
function rr(x,a,b,w,h,r){
 x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);
 x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();
}

/* ---- 期別計算 ---- */
function perRange(n){
 var d0=DB.cfg.start||'2026-09-01',days=+DB.cfg.days||14;
 return {from:addD(d0,(n-1)*days),to:addD(d0,n*days-1)};
}
function perOfDate(ds){
 var n=Math.floor((pd(ds)-pd(DB.cfg.start||'2026-09-01'))/86400000/(+DB.cfg.days||14))+1;
 return n>0?n:0;
}
function lesOfPer(n){
 return LES().filter(function(l){return l.status!=='取消'&&perOfDate(l.date)===n;})
  .sort(function(a,b){return (a.date+a.start)<(b.date+b.start)?-1:1;});
}
function payOfPer(n){
 return PAY().filter(function(p){return p.date&&perOfDate(p.date)===n;})
  .sort(function(a,b){return (a.date||'')<(b.date||'')?-1:1;});
}
function perStat(n){
 var ls=lesOfPer(n),r=perRange(n);
 var S=function(k){return ls.reduce(function(a,l){return a+amt(l,k);},0);};
 var o={n:n,from:r.from,to:r.to,cnt:ls.length,
  pay:S('pay'),coach:S('coach'),gear:S('gear'),fund:S('fund'),admin:S('admin'),
  cash:payOfPer(n).reduce(function(a,p){return a+(+p.due||0);},0),ls:ls};
 o.avail=o.fund-o.admin;
 o.byCoach=COACHES.map(function(c){
  var mine=ls.filter(function(l){return l.coach===c;});
  return {c:c,cnt:mine.length,
   pay:mine.reduce(function(a,l){return a+amt(l,'pay');},0),
   fee:mine.reduce(function(a,l){return a+amt(l,'coach');},0),
   adm:mine.reduce(function(a,l){return a+amt(l,'admin');},0)};
 });
 return o;
}
function activePeriods(){
 var set={};
 LES().forEach(function(l){if(l.status!=='取消'){var n=perOfDate(l.date);if(n>0)set[n]=1;}});
 PAY().forEach(function(p){if(p.date){var n=perOfDate(p.date);if(n>0)set[n]=1;}});
 return Object.keys(set).map(Number).sort(function(a,b){return a-b;});
}

function dl(name,txt){
 var b=new Blob(['\ufeff'+txt],{type:'text/csv;charset=utf-8'});
 var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
}

/* ============ 綁定 ============ */
function val(id){var e=document.getElementById(id);return e?e.value:'';}
function bind(){
 document.querySelectorAll('[data-act]').forEach(function(b){
  b.onclick=function(ev){
   ev.stopPropagation();
   var a=b.dataset.act,id=b.dataset.id;
   if(a==='close')return closeSheet();
   if(a==='newstu'||a==='newstuonly')return fStu();
   if(a==='newles')return fLes();
   if(a==='newbuy')return fBuy('',id);
   if(a==='newen')return fEnroll(id||'');
   if(a==='poster')return fPoster();
   if(a==='swap'){return fSwapCoach(b.dataset.nm);}
   if(a==='doSwap'){
    var nmS=b.dataset.nm,nc=val('f_newc');
    var list=lessonsOf(nmS).filter(function(l){
     return (l.status==='已排定'||l.status==='請假改期')&&(l.students||[]).length<=1;});
    if(!list.length)return alert('沒有可以更換的課。');
    if(!confirm('把 '+nmS+' 的 '+list.length+' 堂課都換成 '+nc+' 教練？日期時間不變。'))return;
    list.forEach(function(l){l.coach=nc;touch('lessons',l);});
    persist();closeSheet();render();
    var sS=STU().filter(function(x){return x.name===nmS;})[0];if(sS)fStu(sS.id);
    alert('已更換 '+list.length+' 堂課的教練。');
    return;}
   if(a==='book'){
    var sb=STU().filter(function(x){return x.name===b.dataset.nm;})[0];
    if(sb)fBook(sb.id);
    return;}
   if(a==='saveBook'){
    var sk=byId(DB.students,id);if(!sk)return;
    if(!val('f_coach'))return alert('請選教練');
    if(!CALSEL.length)return alert('請在行事曆上點出上課日期');
    var lf=leftOf(sk.name);
    if(CALSEL.length>lf&&!confirm('剩餘只有 '+lf+' 堂，這次要排 '+CALSEL.length
      +' 堂，會超過 '+(CALSEL.length-lf)+' 堂。\n還是要建立嗎？'))return;
    var dupB=CALSEL.filter(function(o){
     return LES().some(function(x){return x.status!=='取消'&&x.date===o.d&&x.start===o.s
      &&(x.students||[]).indexOf(sk.name)>=0;});});
    if(dupB.length)return alert(sk.name+' 在 '+dupB[0].d.replace(/-/g,'/')+' '+dupB[0].s
      +' 已經有課了，請換時間或取消那一天。');
    CALSEL.forEach(function(o){
     joinOrCreate({date:o.d,start:o.s,end:o.e,coach:val('f_coach'),plan:val('f_plan'),
       venue:val('f_venue'),status:'已排定',note:''},sk.name);});
    var made2=CALSEL.length;
    persist();closeSheet();render();fStu(sk.id);
    alert('已排 '+made2+' 堂課，'+sk.name+' 剩餘 '+leftOf(sk.name)+' 堂。');
    return;}
   if(a==='saveMv'){
    if(!CALSEL.length)return alert('請在行事曆上點一個新的日期');
    var lm=byId(DB.lessons,id);if(!lm)return;
    var o=CALSEL[0],solo=!!b.dataset.solo,nm3=b.dataset.nm;
    var newC=val('f_coach')||lm.coach;
    /* 同一位學員同一時段已經有課，改過去會變成重複，先擋下來 */
    var dupL=LES().some(function(x){
     return x.id!==lm.id&&x.status!=='取消'&&x.date===o.d&&x.start===o.s
      &&(x.students||[]).indexOf(nm3)>=0;});
    if(dupL)return alert(nm3+' 在 '+o.d.replace(/-/g,'/')+' '+o.s+' 已經有一堂課了。\n請改成別的日期或時間。');
    /* 教練撞堂只提醒，不擋 */
    var busyC=LES().some(function(x){
     return x.id!==lm.id&&x.status!=='取消'&&x.coach===newC&&x.date===o.d&&x.start===o.s;});
    if(busyC&&(lm.students||[]).length<=1
      &&!confirm(newC+'教練在 '+o.d.replace(/-/g,'/')+' '+o.s+' 已經有其他課程。\n還是要排到這個時段嗎？'))return;
    if(newC!==lm.coach&&(lm.students||[]).length>1&&!solo
      &&!confirm('這堂是 '+lm.students.length+' 人的課，換教練會整堂一起換。確定嗎？'))return;
    moveLesson(lm,nm3,o.d,o.s,o.e,solo,newC);
    persist();closeSheet();render();
    var sm=STU().filter(function(x){return x.name===b.dataset.nm;})[0];
    if(sm)fStu(sm.id);
    return;}
   if(a==='mvLeave'){
    var l2=byId(DB.lessons,id);
    if(l2){l2.status='請假改期';touch('lessons',l2);persist();closeSheet();render();
     var s2=STU().filter(function(x){return x.name===b.dataset.nm;})[0];if(s2)fStu(s2.id);}
    return;}
   if(a==='mvCancel'){
    var l3=byId(DB.lessons,id);if(!l3)return;
    if(!confirm('取消這堂課？堂數會還回去，之後可以重新排。'))return;
    if((l3.students||[]).length>1){
     l3.students=l3.students.filter(function(x){return x!==b.dataset.nm;});
     fixGroupPlan(l3);touch('lessons',l3);
    }else{l3.del=1;touch('lessons',l3);}
    persist();closeSheet();render();
    var s3=STU().filter(function(x){return x.name===b.dataset.nm;})[0];if(s3)fStu(s3.id);
    return;}
   if(a==='dly7'||a==='dly14'){
    var step=a==='dly7'?7:14,nm2=b.dataset.nm;
    var mine=lessonsOf(nm2).filter(function(l){
     return (l.status==='已排定'||l.status==='請假改期')&&(l.students||[]).length<=1;});
    var skip=lessonsOf(nm2).filter(function(l){
     return (l.status==='已排定'||l.status==='請假改期')&&(l.students||[]).length>1;}).length;
    if(!mine.length)return alert('沒有可以整批延後的課。團班和一對二請個別改期。');
    if(!confirm('把 '+nm2+' 的 '+mine.length+' 堂課全部往後延 '+step+' 天？'
      +(skip?'\n（'+skip+' 堂是團班或一對二，不會動到）':'')))return;
    mine.forEach(function(l){l.date=addD(l.date,step);touch('lessons',l);});
    persist();closeSheet();render();
    var s4=STU().filter(function(x){return x.name===nm2;})[0];if(s4)fStu(s4.id);
    return;}
   if(a==='calweek')return calFill(7);
   if(a==='cal2week')return calFill(14);
   if(a==='calclear'){CALSEL=[];drawCal();drawChips();return;}

   if(a==='saveEn'){
    var nm=document.getElementById('f_name').value.trim();
    if(!nm)return alert('請填學員姓名');
    var st=id?byId(DB.students,id):null;
    if(!st){
     var dup=STU().filter(function(x){return x.name===nm;})[0];
     if(dup&&!confirm('已經有一位叫「'+nm+'」的學員，要把這筆報名記在他身上嗎？'))return;
     if(dup)st=dup;
    }
    if(!st){
     st={id:uid(),del:0,name:nm,parent:val('f_parent'),phone:val('f_phone'),
       ganghu:val('f_ganghu')||'是',coach:val('f_scoach'),note:''};
     DB.students.push(st);touch('students',st);
    }
    if(val('b_plan')||+val('b_n')||+val('b_due')){
     var pay=readBuy(st.name);pay.id=uid();pay.del=0;
     DB.payments.push(pay);touch('payments',pay);
    }
    var made=0;
    if(val('f_coach')&&CALSEL.length){
     var bp=buyPlan(val('b_plan'));
     var lesplan=(bp&&bp.les)||'一對一-菁英-單堂';
     CALSEL.forEach(function(o){
      joinOrCreate({date:o.d,start:o.s,end:o.e,coach:val('f_coach'),
        plan:lesplan,venue:val('f_venue'),status:'已排定',note:''},st.name);
      made++;});
    }
    persist();closeSheet();render();
    alert('完成：'+st.name+(made?'　已排 '+made+' 堂課':'　尚未排課'));
    return;}

   if(a==='saveStu'){
    var n=document.getElementById('f_name').value.trim();
    if(!n)return alert('請填學員姓名');
    var o={name:n,parent:val('f_parent'),phone:val('f_phone'),ganghu:val('f_ganghu'),
      coach:val('f_scoach'),note:val('f_note')};
    if(id){
     var old=byId(DB.students,id);
     if(old&&old.name!==n){
      DB.payments.forEach(function(p){if(p.student===old.name){p.student=n;touch('payments',p);}});
      DB.lessons.forEach(function(l){
       if(l.students.indexOf(old.name)>=0){
        l.students=l.students.map(function(x){return x===old.name?n:x;});touch('lessons',l);}});
     }
     if(old){Object.assign(old,o);touch('students',old);}
    }else{
     o.id=uid();o.del=0;DB.students.push(o);touch('students',o);
     if(val('b_plan')||+val('b_paid')||+val('b_n')){
      var pay=readBuy(n);pay.id=uid();pay.del=0;DB.payments.push(pay);touch('payments',pay);
     }
    }
    persist();closeSheet();render();return;}

   if(a==='delStu'){
    var s2=byId(DB.students,id);
    if(!s2)return;
    if(confirm('刪除「'+s2.name+'」？他的報名收款紀錄也會一起刪掉，排課紀錄不會動。')){
     s2.del=1;touch('students',s2);
     DB.payments.forEach(function(p){if(p.student===s2.name&&!p.del){p.del=1;touch('payments',p);}});
     persist();closeSheet();render();}
    return;}

   if(a==='saveBuy'){
    var who=b.dataset.nm;
    if(!val('b_plan')&&!+val('b_n'))return alert('請選方案或填堂數');
    var o2=readBuy(who);
    if(id){var pe=byId(DB.payments,id);if(pe){Object.assign(pe,o2);touch('payments',pe);}}
    else{o2.id=uid();o2.del=0;DB.payments.push(o2);touch('payments',o2);}
    persist();closeSheet();
    var st=STU().filter(function(x){return x.name===who;})[0];
    render();if(st)fStu(st.id);return;}

   if(a==='delBuy'){
    var p3=byId(DB.payments,id);
    if(p3&&confirm('刪除這筆報名收款紀錄？')){
     p3.del=1;touch('payments',p3);
     persist();closeSheet();
     var st2=STU().filter(function(x){return x.name===p3.student;})[0];
     render();if(st2)fStu(st2.id);}
    return;}

   if(a==='saveLes'||a==='saveAfter'){
    var ss=readNames();
    if(!val('f_coach'))return alert('請選教練');
    if(!val('f_plan'))return alert('請選方案');
    /* 名單上沒有的名字，自動建立學員 */
    ss.forEach(function(nm){
     if(!STU().some(function(s){return s.name===nm;})){
      var ns={id:uid(),del:0,name:nm,parent:'',phone:'',ganghu:'是',coach:val('f_coach'),note:''};
      DB.students.push(ns);touch('students',ns);}});
    var o3={date:val('f_date'),start:val('f_start'),end:val('f_end'),coach:val('f_coach'),
      plan:val('f_plan'),students:ss,venue:val('f_venue'),status:val('f_status'),note:val('f_note')};
    if(a==='saveAfter'){
     var base=byId(DB.lessons,id);
     if(!base)return;
     var aff=LES().filter(function(l){return l.rid&&l.rid===base.rid&&l.date>=base.date;});
     if(!confirm('這堂以後的 '+aff.length+' 堂課會一起改成新的設定，日期各自保留。確定？'))return;
     aff.forEach(function(l){var d=l.date;Object.assign(l,o3);l.students=o3.students.slice();
      l.date=(l.id===id?o3.date:d);touch('lessons',l);});
     persist();closeSheet();render();return;}
    if(id){var le=byId(DB.lessons,id);
     if(le){Object.assign(le,o3);le.students=o3.students.slice();touch('lessons',le);}
     persist();closeSheet();render();return;}
    var dts=CALSEL.slice();
    if(!dts.length)return alert('請在行事曆上點出上課日期');
    if(dts.length>1&&!confirm('一次建立 '+dts.length+' 堂課\n'
      +dts[0]+' ～ '+dts[dts.length-1]+'\n\n確定建立？'))return;
    var rid=dts.length>1?uid():'';
    dts.forEach(function(d){
     var nn={};for(var k in o3)nn[k]=o3[k];
     nn.students=o3.students.slice();nn.date=d;nn.id=uid();nn.del=0;if(rid)nn.rid=rid;
     DB.lessons.push(nn);touch('lessons',nn);});
    persist();closeSheet();render();
    if(dts.length>1)alert('已建立 '+dts.length+' 堂課');
    return;}

   if(a==='delLes'){var ld=byId(DB.lessons,id);
    if(ld&&confirm('刪除這堂課？')){ld.del=1;touch('lessons',ld);persist();closeSheet();render();}return;}
   if(a==='delSeries'){
    var b2=byId(DB.lessons,id);if(!b2||!b2.rid)return;
    var cnt=seriesOf(b2.rid).length;
    if(confirm('刪除整組重複課程共 '+cnt+' 堂？無法復原。')){
     LES().forEach(function(l){if(l.rid===b2.rid){l.del=1;touch('lessons',l);}});
     persist();closeSheet();render();}
    return;}
   if(a==='done'){var lt=byId(DB.lessons,id);
    if(lt){lt.status=(lt.status==='已完成'?'已排定':'已完成');touch('lessons',lt);persist();render();}
    return;}

   if(a==='csvS')return csvS();
   if(a==='csvL')return csvL();
   if(a==='csvP')return csvP();
   if(a==='csvB')return csvB();
   if(a==='repP'){var pn=+(setP.match(/\d+/)||[1])[0];
    if(!lesOfPer(pn).length&&!payOfPer(pn).length)
     return alert(setP+'沒有任何課程或收款紀錄，換一期試試。');
    b.textContent='產生中…';b.disabled=true;
    setTimeout(function(){repPeriod(pn);
     setTimeout(function(){render();},1200);},50);
    return;}
   if(a==='repA'){b.textContent='產生中…';b.disabled=true;
    setTimeout(function(){repAll();
     setTimeout(function(){render();},1500);},50);
    return;}
   if(a==='sync')return syncNow(true);
   if(a==='pushall'){if(confirm('把這支手機上的所有資料上傳到雲端？\n\n只在「主要那支手機」按一次就好。'
    +'其他裝置登入後會自動把資料拉下來，不需要再按，重複按可能產生同名的學員。'))pushAll();return;}
   if(a==='savesb'){
    var u=val('c_url').trim().replace(/\/+$/,''),ky=val('c_key').trim();
    if(u&&!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(u))
     return alert('網址看起來不對。應該長得像 https://abcdefgh.supabase.co，結尾不要有斜線或其他路徑。');
    if(u&&ky.length<20)
     return alert('金鑰看起來太短。請完整複製那一整串金鑰，不要漏字。');
    SB={url:u,key:ky};save('sb',SB);
    if(!u||!ky){SESS=null;save('sess',null);setST('off');render();upPill();
     return alert('已清除連線設定，改回只存在這支手機。');}
    render();upPill();
    alert('連線設定已儲存。接著在下面輸入帳號密碼登入。');return;}
   if(a==='login'){
    var em=val('c_em').trim(),pw=val('c_pw');
    if(!em||!pw)return alert('請輸入帳號和密碼');
    b.disabled=true;b.textContent='登入中…';
    sbLogin(em,pw).then(function(){
     render();upPill();syncNow(true);
    }).catch(function(e){
     b.disabled=false;b.textContent='登入';
     alert('登入失敗\n\n'+String(e.message||e));});
    return;}
   if(a==='logout'){
    if(!confirm('登出後這支手機就不再同步，本機資料還在。確定登出？'))return;
    sbLogout();return;}
   if(a==='bak'){var bb=new Blob([JSON.stringify(DB)],{type:'application/json'});
    var l2=document.createElement('a');l2.href=URL.createObjectURL(bb);
    l2.download='港湖特訓班備份_'+today()+'.json';l2.click();return;}
   if(a==='res'){var inp=document.createElement('input');inp.type='file';inp.accept='.json';
    inp.onchange=function(){var f=inp.files[0];if(!f)return;var rd=new FileReader();
     rd.onload=function(){try{var dd=JSON.parse(rd.result);
      if(dd.students)DB.students=dd.students;if(dd.lessons)DB.lessons=dd.lessons;
      if(dd.payments)DB.payments=dd.payments;if(dd.cfg)DB.cfg=dd.cfg;
      ['students','lessons','payments'].forEach(function(c){
       DB[c].forEach(function(r){if(r.del===undefined)r.del=0;if(!r.ts)r.ts=0;});});
      persistOnly();render();alert('已還原備份。若要同步到雲端，請按「全部上傳」。');}
      catch(e){alert('檔案格式不對，請確認選的是本系統匯出的 JSON。');}};
     rd.readAsText(f);};inp.click();return;}
   if(a==='wipe'){if(confirm('清除這支手機上的全部資料？無法復原，建議先備份。\n注意：雲端上的資料不會被刪除。')){
    DB.students=DEFSTU.map(function(n){return {id:uid(),name:n,parent:'',phone:'',ganghu:'是',coach:'',note:'',del:0,ts:0};});
    DB.lessons=[];DB.payments=[];PEND={students:{},lessons:{},payments:{},cfg:0};
    SINCE=0;save('since',0);persistOnly();render();}return;}
   if(a==='savecfg'){DB.cfg={start:val('cstart'),days:+val('cdays')||14};
    touchCfg();persist();render();alert('設定已儲存');return;}
   if(a==='prevw'){calMon=addD(calMon,-7);render();return;}
   if(a==='nextw'){calMon=addD(calMon,7);render();return;}
   if(a==='thisw'){var t=new Date();t.setDate(t.getDate()-((t.getDay()+6)%7));calMon=ymd(t);render();return;}
  };
 });
 document.querySelectorAll('[data-edit]').forEach(function(c){
  c.onclick=function(){var t=c.dataset.edit;
   if(t==='stu')fStu(c.dataset.id);
   if(t==='les')fLes(c.dataset.id);
   if(t==='buy')fBuy(c.dataset.id);
   if(t==='mv')fMove(c.dataset.id,c.dataset.nm);};
 });
 document.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){lesF=b.dataset.f;render();};});
 document.querySelectorAll('[data-sf]').forEach(function(b){b.onclick=function(){stuF=b.dataset.sf;render();};});
 document.querySelectorAll('[data-seg]').forEach(function(b){b.onclick=function(){stuSeg=b.dataset.seg;render();};});
 var q=document.getElementById('q');
 if(q)q.oninput=function(){stuQ=q.value.trim();var p=q.selectionStart;render();
  var n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(p,p);}};
 var mon=document.getElementById('mon');
 if(mon)mon.onchange=function(){calMon=mon.value;render();};
 var per=document.getElementById('per');
 if(per)per.onchange=function(){setP=per.value;render();};
 /* 重複排課 */
 var fc=document.getElementById('f_coach');
 if(fc)fc.onchange=function(){drawCal();};
 var fs=document.getElementById('f_start');
 if(fs)fs.onchange=function(){
  /* 課程編輯頁：改開始時間時結束時間自動往後一小時 */
  var fe=document.getElementById('f_end');
  if(fe){var i=TIMES.indexOf(fs.value);
   if(i>=0&&TIMES[i+2])fe.value=TIMES[i+2];}
  recalcDays();};
 ['f_dur','f_per'].forEach(function(k){
  var e=document.getElementById(k);if(e)e.onchange=recalcDays;});
 ['f_plan','f_stu'].forEach(function(k){var e=document.getElementById(k);
  if(e){e.onchange=upSplit;e.oninput=upSplit;}});
 /* 購課自動計價 */
 var bp=document.getElementById('b_plan');if(bp)bp.onchange=function(){upBuy(true);drawChips();};
 var bn=document.getElementById('b_n');if(bn)bn.oninput=function(){upBuyDue();drawChips();};
 if(document.getElementById('mc')){drawCal();drawChips();}
}
document.getElementById('syncp').onclick=function(){
 if(!sbReady()||!authed()){TAB='set';
  document.querySelectorAll('.tabbar button').forEach(function(x){
   x.classList.toggle('on',x.dataset.t==='set');});
  render();window.scrollTo(0,document.body.scrollHeight);return;}
 syncNow(true);};
render();upPill();
if(sbReady()&&authed())syncNow();
</script></body></html>
